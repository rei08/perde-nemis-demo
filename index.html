<title>Perde Nemis Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a dark-teal top bar, then one view at a time. The home page is a walk through a day at the window, in
   full-width chapters: curtains hanging from one rail (they sway, and can be pulled along it), a room where the
   light moves from morning to night as the page scrolls, the workshop, and a closing scene where the curtains draw.
   The other views sit in a centred column.
   The palette (data-design on the root element), light or dark (data-mode) and the language only swap tokens and strings.
   Each of the six combinations is a deliberate look, so the page sets every colour itself. */
:root {
  color-scheme: light;
  /* Pishë: dark teal with sand. Teal carries the frame of the page; fabrics hang on a warm neutral. */
  --bg: #ECE6DA; --surface: #F8F4EC; --surface-2: #DFD7C7; --ink: #17292B; --ink-2: #4D5B58; --line: #CDC3B0; --field-line: #7B8580;
  --accent: #17474A; --accent-ink: #F6F0E4; --accent-2: #8F4E30; --link: #1A5559; --btn-line: #17474A;
  --chrome: #143E41; --chrome-ink: #F3ECDE; --chrome-2: #C2CEC6; --chrome-line: #2C5B5E; --chrome-mark: #D9B98A;
  --good: #2A6A45; --good-bg: #DCEADB; --warn: #7A5200; --warn-bg: #F3E4BE; --bad: #A33A28; --bad-bg: #F3DAD1;
  --wall: #E6DFD1; --floor: #C9BEA8; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #8B8D86;
  --ground: #D6CCB8; --spot: rgba(255, 252, 244, .6); --cast: rgba(40, 34, 22, .3); --art: #DFD7C7; --tape: #DDB565; --tape-ink: #2A2118;
  --font-display: 'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body: 'Albert Sans', 'Segoe UI', system-ui, sans-serif;
  --font-data: 'Albert Sans', 'Segoe UI', system-ui, sans-serif;
  --r: 14px; --r-btn: 999px; --bw: 1px;
  --shadow: none;
}
:root[data-design="toke"] {
  color-scheme: light;
  /* Tokë: the same teal frame, with clay doing the calling. Warmer and more earthen. */
  --bg: #EFE5D8; --surface: #FAF4EA; --surface-2: #E3D5C2; --ink: #2A211B; --ink-2: #5A4E44; --line: #D3C2AC; --field-line: #857768;
  --accent: #9A4E32; --accent-ink: #FFF7EC; --accent-2: #1F5054; --link: #1C5357; --btn-line: #9A4E32;
  --chrome: #1B4A4D; --chrome-ink: #F6ECDD; --chrome-2: #C7D2C9; --chrome-line: #366467; --chrome-mark: #E0A583;
  --good: #2A6A45; --good-bg: #DDE9D6; --warn: #7A5200; --warn-bg: #F4E3B9; --bad: #A33A28; --bad-bg: #F4D9CE;
  --wall: #E9DCCB; --floor: #C6B299; --sky1: #C8DDE2; --sky2: #F4F1E8; --frame: #FCF8F0; --metal: #8F867A;
  --ground: #D8C6AD; --spot: rgba(255, 250, 240, .6); --cast: rgba(60, 38, 20, .3); --art: #E3D5C2; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-mode="dark"] {
  color-scheme: dark;
  /* Pishë, dark: the same teal, now the ground, with sand doing the calling. */
  --bg: #0F2A2C; --surface: #16383A; --surface-2: #1E4547; --ink: #EFE9DC; --ink-2: #B3C1B9; --line: #2B5254; --field-line: #7A9A96;
  --accent: #E6DCC6; --accent-ink: #12302F; --accent-2: #DB9A73; --link: #9ED4CC; --btn-line: #E6DCC6;
  --chrome: #0A2022; --chrome-ink: #F3ECDE; --chrome-2: #A9B9B0; --chrome-line: #23464A; --chrome-mark: #D9B98A;
  --good: #8FD3A6; --good-bg: #1D4133; --warn: #EBC878; --warn-bg: #3F3A1E; --bad: #F2A090; --bad-bg: #4A2A26;
  --wall: #D8D0C0; --floor: #B5A88F; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #A9ABA3;
  --ground: #091F21; --spot: rgba(255, 236, 200, .16); --cast: rgba(0, 0, 0, .55); --art: #CFC7B6; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-design="toke"][data-mode="dark"] {
  color-scheme: dark;
  /* Tokë, dark: earth-brown ground under the teal bar, clay doing the calling. */
  --bg: #251B15; --surface: #30241C; --surface-2: #3C2E24; --ink: #F4EADB; --ink-2: #CDBDAA; --line: #4E3D30; --field-line: #A08D79;
  --accent: #D67F58; --accent-ink: #1F120B; --accent-2: #86C2BB; --link: #8ECFC7; --btn-line: #D67F58;
  --chrome: #153537; --chrome-ink: #F6ECDD; --chrome-2: #B9C8BF; --chrome-line: #2C5356; --chrome-mark: #E0A583;
  --good: #9AD6A9; --good-bg: #24402D; --warn: #EBC878; --warn-bg: #45391C; --bad: #F3A693; --bad-bg: #4E2A24;
  --wall: #DCCFBD; --floor: #B39C82; --sky1: #C8DDE2; --sky2: #F4F1E8; --frame: #FCF8F0; --metal: #B9A27E;
  --ground: #1A120D; --spot: rgba(255, 214, 160, .16); --cast: rgba(0, 0, 0, .55); --art: #D3C5B0; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-design="nate"][data-mode="light"] {
  color-scheme: light;
  /* Natë, light: sand ground under the deepest teal bar, with ochre doing the calling. */
  --bg: #EEE8DB; --surface: #F9F5EC; --surface-2: #E0D8C6; --ink: #14292B; --ink-2: #4C5A57; --line: #CEC4AF; --field-line: #7B8580;
  --accent: #CFA25A; --accent-ink: #1E1609; --accent-2: #7E5210; --link: #1A5559; --btn-line: #8A6A2A;
  --chrome: #0B2325; --chrome-ink: #F0E8D8; --chrome-2: #A9B9B0; --chrome-line: #24484A; --chrome-mark: #D7AE74;
  --good: #2A6A45; --good-bg: #DCEADB; --warn: #7A5200; --warn-bg: #F3E4BE; --bad: #A33A28; --bad-bg: #F3DAD1;
  --wall: #E6DFD1; --floor: #C9BEA8; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #B59A62;
  --ground: #D6CCB8; --spot: rgba(255, 252, 244, .6); --cast: rgba(40, 34, 22, .3); --art: #DFD7C7; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-design="nate"][data-mode="dark"] {
  color-scheme: dark;
  /* Natë, dark (the form it was designed in): dark teal all the way through, with ochre light. The showroom after hours. */
  --bg: #102F31; --surface: #173C3F; --surface-2: #1F494C; --ink: #F0E8D8; --ink-2: #B5C2B8; --line: #2D5759; --field-line: #7A9A96;
  --accent: #D7AE74; --accent-ink: #1E1609; --accent-2: #CF8562; --link: #E3C08E; --btn-line: #D7AE74;
  --chrome: #0B2325; --chrome-ink: #F0E8D8; --chrome-2: #A9B9B0; --chrome-line: #24484A; --chrome-mark: #D7AE74;
  --good: #8FD3A6; --good-bg: #1D4133; --warn: #EBC878; --warn-bg: #3F3A1E; --bad: #F2A090; --bad-bg: #4A2A26;
  --wall: #D8D0C0; --floor: #B5A88F; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #C2A873;
  --ground: #0A2325; --spot: rgba(255, 214, 150, .17); --cast: rgba(0, 0, 0, .55); --art: #CFC7B6; --tape: #D7AE74; --tape-ink: #1E1609;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h, 0px) + 12px); scroll-padding-bottom: 76px; }
:root.drawer-open, :root.drawer-open body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 400; letter-spacing: -.005em; }
h1 { font-size: clamp(2.3rem, 1.3rem + 4.2vw, 4.6rem); line-height: 1; }
h2 { font-size: clamp(1.9rem, 1.3rem + 2.4vw, 3.2rem); line-height: 1.04; }
h3 { font-size: 1.05rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p, dl, ul, ol { margin: 0; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.ok-text { color: var(--good); font-size: .88rem; font-weight: 600; }
.warn-text { color: var(--warn); font-size: .88rem; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
bdi { unicode-bidi: isolate; }

/* top bar: clear over the opening scene, solid as soon as the page moves and on every other view */
.top { position: relative; z-index: 20; background: var(--chrome); color: var(--chrome-ink); --tk: var(--chrome-ink); --tk2: var(--chrome-2); --tbg: var(--chrome); --tmark: var(--chrome-mark); transition: background-color .35s ease; }
@media (min-height: 600px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); } }
:root.top-clear .top { background: transparent; --tk: var(--ink); --tk2: var(--ink-2); --tbg: var(--bg); --tmark: var(--accent-2); }
.top-row { display: flex; align-items: center; gap: 8px 18px; min-height: 64px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; flex: none; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-display); font-size: 1.7rem; font-weight: 400; letter-spacing: .01em; color: var(--tk); transition: color .35s ease; }
.brand svg { width: 30px; height: 30px; color: var(--tmark); flex: none; }
.top :focus-visible { outline-color: var(--tk); }
.menu { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
#nav { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.navlink { position: relative; white-space: nowrap; background: none; border: 0; padding: 9px 11px; cursor: pointer; color: var(--tk2); font-weight: 500; font-size: .93rem; transition: color .2s ease; }
.navlink::after { content: ''; position: absolute; left: 11px; right: 11px; bottom: 4px; height: 1px; background: currentColor; scale: 0 1; transform-origin: 0 50%; transition: scale .3s cubic-bezier(.2, .7, .2, 1); }
.navlink:hover, .navlink[aria-current="page"] { color: var(--tk); }
.navlink:hover::after, .navlink[aria-current="page"]::after { scale: 1 1; }
#nav-home { display: none; } /* the name in the corner is the way home; the link shows in the full-screen menu */
.btn.top-cta { flex: none; background: var(--tk); color: var(--tbg); border-color: var(--tk); border-radius: 999px; padding-inline: 16px; transition: background-color .35s ease, color .35s ease; }
.btn.top-cta[aria-current="page"] { background: transparent; color: var(--tk); }
.l-short { display: none; }
@media (max-width: 430px) { .l-full { display: none; } .l-short { display: inline; } }
#controls { display: flex; align-items: center; gap: 10px; flex: none; }
.seg { display: inline-flex; border: var(--bw) solid var(--field-line); border-radius: var(--r-btn); overflow: hidden; background: var(--surface); }
.seg-btn { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-size: .82rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
.seg-btn[aria-pressed="true"]:focus-visible { outline-color: var(--bg); }
.seg-btn i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(128, 128, 128, .6); }
.sw-pishe i { background: linear-gradient(135deg, #ECE6DA 50%, #17474A 50%); }
.sw-toke i { background: linear-gradient(135deg, #17474A 50%, #9A4E32 50%); }
.sw-nate i { background: linear-gradient(135deg, #102F31 50%, #D7AE74 50%); }
.top .seg { border: 0; background: none; overflow: visible; gap: 2px; }
.top .seg-btn { color: var(--tk2); padding: 6px; font-size: .78rem; border-radius: 999px; }
.top .seg-btn[aria-pressed="true"] { background: none; color: var(--tk); text-decoration: underline; text-underline-offset: 5px; }
.top .seg-btn[aria-pressed="true"] i { outline: 1.5px solid var(--tk); outline-offset: 2px; }
.top .seg-btn:focus-visible { outline: 2px solid var(--tk); outline-offset: 0; }
.top .seg-btn .nm { display: none; }
/* light or dark: one switch, the mode in use filled in */
.top .seg.mode { border: 1px solid var(--tk2); border-radius: 999px; padding: 2px; gap: 0; }
.top .seg.mode .seg-btn { padding: 5px 8px; gap: 5px; }
.top .seg.mode .seg-btn svg { width: 16px; height: 16px; display: block; }
.top .seg.mode .seg-btn[aria-pressed="true"] { background: var(--tk); color: var(--tbg); text-decoration: none; }
.noscript { padding-block: 40px; font-size: 1.05rem; }
.menu-btn { display: none; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--tk2); background: none; cursor: pointer; place-items: center; color: var(--tk); padding: 0; }
.menu-bars { position: relative; width: 18px; height: 10px; display: block; }
.menu-bars::before, .menu-bars::after { content: ''; position: absolute; left: 0; right: 0; height: 1.5px; background: currentColor; transition: transform .3s cubic-bezier(.2, .7, .2, 1), top .3s ease; }
.menu-bars::before { top: 0; }
.menu-bars::after { top: 8.5px; }
:root.menu-open .menu-bars::before { top: 4px; transform: rotate(45deg); }
:root.menu-open .menu-bars::after { top: 4px; transform: rotate(-45deg); }
:root.menu-open, :root.menu-open body { overflow: hidden; }
.demo-note { font-size: .8rem; color: var(--chrome-2); flex: 1 1 100%; max-width: 90ch; opacity: .85; }

main { padding-block: 44px 88px; display: flex; flex-direction: column; gap: 56px; outline: none; }
main.view-home, main.paged { display: block; padding-block: 0; }
.view-body { display: flex; flex-direction: column; gap: 56px; padding-block: 48px 96px; }
.page-head { position: relative; background: var(--grain, none), var(--surface-2); background-color: var(--surface-2); overflow: hidden; }
.page-head::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .3)), var(--metal); z-index: 3; }
.page-head-in { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px clamp(24px, 5vw, 72px); align-items: end; min-height: clamp(220px, 30vw, 340px); }
.page-head .view-head { padding-block: clamp(40px, 6vw, 84px) clamp(28px, 4vw, 52px); }
.page-rail { align-self: stretch; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 20px); -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
.page-rail .art-view::before { display: none; }
.page-rail .art-cloth { left: 0; right: 0; top: 8px; }
.page-rail .art-view:nth-child(2) .art-cloth { top: 8px; }
@keyframes viewIn { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: none; } }
main.is-entering { animation: viewIn .45s cubic-bezier(.2, .7, .2, 1) both; }
main.view-home.is-entering { animation-name: viewFade; }
@keyframes viewFade { from { opacity: 0; } to { opacity: 1; } }
.view-head { display: flex; flex-direction: column; gap: 14px; padding-bottom: 6px; }
.view-head p { color: var(--ink-2); max-width: 62ch; font-size: 1.08rem; }
.foot { background: var(--grain, none), var(--chrome); background-color: var(--chrome); color: var(--chrome-2); font-size: .85rem; border-top: 1px solid var(--chrome-line); }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px 24px; padding-block: 26px 34px; }
.foot b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: var(--chrome-ink); }
/* things that come in as they are reached; only where the experience layer has said it will bring them in */
:root.fx .rv { opacity: 0; translate: 0 26px; transition: opacity .8s ease var(--d, 0s), translate .9s cubic-bezier(.2, .7, .2, 1) var(--d, 0s); }
:root.fx .rv.in { opacity: 1; translate: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 22px; border-radius: var(--r-btn); border: var(--bw) solid var(--btn-line); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; line-height: 1.2; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.inv { background: var(--chrome-ink); color: var(--chrome); border-color: var(--chrome-ink); }
.btn.ghost.inv { background: transparent; color: var(--chrome-ink); border-color: var(--chrome-ink); }
.btn.small { padding: 7px 13px; font-size: .86rem; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.btn.ghost.danger { background: transparent; color: var(--bad); }
.btn[disabled] { background: var(--surface-2); color: var(--ink-2); border-color: var(--field-line); border-style: dashed; cursor: not-allowed; filter: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; font-size: .86rem; text-align: left; }

/* home: the opening curtain (plays once per visit, never blocks a click) */
.intro { position: fixed; inset: 0; z-index: 100; pointer-events: none; animation: introOff 0s linear 2.1s forwards; }
.intro-drape { position: absolute; top: 0; bottom: 0; width: 50.5%; --fab: #1E4F54; --n: 9; box-shadow: 0 0 44px rgba(0, 0, 0, .4); animation: introOpen 1.35s cubic-bezier(.7, 0, .2, 1) .55s forwards; }
.intro-drape.l { left: 0; }
.intro-drape.r { right: 0; }
.intro-mark { position: absolute; inset: 0; display: grid; place-items: center; font: 400 clamp(2.2rem, 7vw, 5rem)/1 var(--font-display); color: #F3ECDE; animation: introMark .5s ease .62s forwards; z-index: 1; text-shadow: 0 2px 18px rgba(0, 0, 0, .45); }
@keyframes introOpen { to { width: 0; } }
@keyframes introMark { to { opacity: 0; } }
@keyframes introOff { to { visibility: hidden; } }
:root.intro-done .intro { display: none; }

/* chapter one: the display rail, one screen tall. The backdrop takes a little of the fabric's colour and carries its
   name, very large, drifting behind; the curtains are canvases hung from the rail, moved and swung by the
   experience layer. The headline and the choices stand on the floor in front of them. */
.hero { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 100vh; min-height: 100svh; margin-top: calc(var(--top-h, 0px) * -1); padding-top: var(--top-h, 0px); background: var(--grain, none), var(--amb, var(--bg)); background-color: var(--amb, var(--bg)); transition: background-color .9s ease; overflow: clip; }
.stage-view { grid-row: 1; position: relative; min-height: 300px; container-type: size; overflow: hidden; touch-action: pan-y pinch-zoom; cursor: grab; -webkit-user-select: none; user-select: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.stage-view.is-drag { cursor: grabbing; }
.stage-in { position: absolute; inset: 0; --nav: max(64px, calc(2.4rem + 14px)); --sw: clamp(130px, min(24vw, 30vh), 360px); --sh: calc(var(--sw) * 1.7); }
/* the curtain is as large as the stage allows: room for its reflection, room for the arrows under its hem, never wider than the side curtains leave */
@supports (width: 1cqh) { .stage-in { --sw: clamp(110px, min((100cqh - 26px) / 1.98, (100cqh - 19px - var(--nav)) / 1.7, 44cqw), 440px); } }
@media (max-width: 700px) { @supports (width: 1cqh) { .stage-in { --sw: clamp(110px, min((100cqh - 26px) / 1.98, (100cqh - 19px - var(--nav)) / 1.7, 52cqw), 440px); } } }
.stage-word { position: absolute; left: 0; right: 0; top: 14px; height: var(--sh); display: flex; align-items: center; pointer-events: none; }
.word-track { display: flex; align-items: baseline; flex: none; white-space: nowrap; font: 400 calc(var(--sh) * .56)/1 var(--font-display); color: var(--word, var(--surface-2)); transition: color .9s ease; animation: wordIn .9s ease both; will-change: transform; }
.word-track span, .word-track em { margin-right: .2em; }
.word-track em { font-size: .62em; opacity: .62; }
@keyframes wordIn { from { opacity: 0; } to { opacity: 1; } }
.stage-floor { position: absolute; left: 0; right: 0; top: calc(14px + var(--sh) - 5px); bottom: 0; background: linear-gradient(180deg, var(--floor-tint, rgba(0, 0, 0, .07)), transparent 62%); }
.stage-spot { position: absolute; left: 50%; top: 0; width: calc(var(--sw) * 3); height: 100%; translate: -50% 0; background: radial-gradient(closest-side, var(--spot), transparent); }
.stage-rail { position: absolute; left: 0; right: 0; top: 9px; height: 9px; background: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .32)), var(--metal); box-shadow: 0 7px 14px -4px var(--cast); z-index: 3; }
/* no drawing surface: the curtains are the striped CSS drawing */
.stage-view.no-canvas .slide { background: linear-gradient(90deg, rgba(0, 0, 0, .22), rgba(255, 255, 255, .2) 50%, rgba(0, 0, 0, .22)) 0 0 / calc(100% / var(--n, 7)) 100% repeat-x, var(--fab, #ccc); }
.slide { position: absolute; top: 13px; left: 50%; width: var(--sw); height: var(--sh); margin-left: calc(var(--sw) / -2); transform-origin: 50% 0; z-index: 2; }

.slide::after { content: ''; position: absolute; left: -6%; right: -6%; top: calc(var(--sh) - 11px); height: 34px; background: radial-gradient(closest-side, var(--cast), transparent); z-index: -1; }
.stage-light { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(circle at var(--lx, 50%) var(--ly, 30%), rgba(255, 244, 222, .6), transparent 38%); mix-blend-mode: soft-light; }
.stage-cursor { position: absolute; left: 0; top: 0; z-index: 6; width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 600; letter-spacing: .04em; pointer-events: none; opacity: 0; scale: .5; transition: opacity .2s ease, scale .25s cubic-bezier(.2, .7, .2, 1); }
.stage-cursor.on { opacity: .94; scale: 1; }

@media (hover: none) { .stage-cursor { display: none; } }
.hero-foot { grid-row: 2; position: relative; z-index: 5; width: 100%; padding-block: 12px clamp(20px, 3.4vh, 38px); display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 7fr); gap: 16px clamp(24px, 4vw, 64px); align-items: end; }

/* every sample's text lies in the same cell and only the chosen one shows: the block is as tall as the tallest, so the stage keeps its size from sample to sample */
.stage-info { display: grid; min-width: 0; }
.car-pane { grid-area: 1 / 1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px clamp(18px, 2.6vw, 40px); align-items: end; min-width: 0; }

.car-pane .warn-text { color: var(--warn); font-size: .88rem; }
.spec-line { font-size: .84rem; }
.car-pane .btn-row { gap: 6px 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; display: inline-flex; cursor: pointer; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sw i { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 1px solid var(--field-line); box-shadow: inset 0 0 0 3px var(--surface); display: block; transition: scale .2s cubic-bezier(.2, .7, .2, 1); }

/* cloth painted by the experience layer; until it is, the striped CSS drawing underneath shows */
canvas.cloth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; }
.fab.dressed { background: none; }

/* chapter two: a day at the window. The section is the room; while it is pinned, the scroll is the clock */
.day { position: relative; background: var(--wall, var(--surface-2)); }
.day.is-pinned { height: 250vh; }
.day-sticky { position: relative; overflow: clip; min-height: max(640px, var(--need, 0px)); }
.day.is-pinned .day-sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 0px)); min-height: 0; height: calc(100vh - var(--top-h, 0px)); height: calc(100svh - var(--top-h, 0px)); }
.day-room { position: absolute; inset: 0; --floor: #B7A68C; --frame: #FBF8F1; --metal: #8B8D86; }
.day-room .look { position: absolute; inset: 0; }

.day-room .scene-hang { z-index: 2; }
.day-room .scene .fab { filter: brightness(var(--cloth-b, 1)); }

.day-room .scene-win { overflow: hidden; border-width: 7px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .16), inset 0 0 22px rgba(0, 0, 0, .16), 0 13px 0 -3px var(--frame), 0 15px 0 -3px rgba(0, 0, 0, .14); background: radial-gradient(circle at var(--sunx, 30%) var(--suny, 40%), rgba(255, 253, 240, var(--sun, 1)) 0, rgba(255, 253, 240, var(--sun, 1)) 2.2%, rgba(255, 244, 205, calc(var(--sun, 1) * .5)) 3.4%, rgba(255, 240, 190, 0) 18%), linear-gradient(180deg, var(--sky1), var(--sky2)); }
.day-room .scene-win::before { content: ''; position: absolute; inset: 0; opacity: var(--night, 0); background: radial-gradient(circle at 74% 20%, #F6F1DC 0, #F6F1DC 2%, rgba(246, 241, 220, .22) 2.8%, transparent 9%), radial-gradient(1.6px 1.6px at 18% 26%, #fff, transparent), radial-gradient(1.4px 1.4px at 34% 14%, #fff, transparent), radial-gradient(1.6px 1.6px at 52% 34%, #fff, transparent), radial-gradient(1.2px 1.2px at 12% 58%, #fff, transparent), radial-gradient(1.5px 1.5px at 88% 46%, #fff, transparent), radial-gradient(1.2px 1.2px at 62% 12%, #fff, transparent), radial-gradient(1.4px 1.4px at 40% 52%, #fff, transparent); }
.day-room .scene-floor { height: 10%; background: linear-gradient(180deg, rgba(0, 0, 0, .14), transparent 50%), repeating-linear-gradient(90deg, rgba(0, 0, 0, .09) 0, rgba(0, 0, 0, .09) 1px, transparent 1px, transparent 9.09%), var(--floor); }
.day-room .scene-floor::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 13px; background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .3)); box-shadow: 0 -1px 0 rgba(0, 0, 0, .1); }
.scene-beam { display: none; }
.day-room .scene-beam { display: block; position: absolute; left: 63%; top: calc(var(--winTop) + var(--winH)); width: calc(var(--winW) * .9); bottom: 0; translate: -50% 0; transform-origin: 50% 0; transform: skewX(var(--skew, -22deg)); background: linear-gradient(180deg, rgba(255, 242, 208, .6), rgba(255, 242, 208, 0) 85%); opacity: var(--beam, 1); z-index: 1; }
.day-lamp { position: absolute; right: 2.2%; bottom: 10%; width: 92px; height: 46%; z-index: 2; }
.day-lamp::before { content: ''; position: absolute; left: 50%; bottom: 0; width: 3px; height: 100%; translate: -50% 0; background: #4E473D; }
.day-lamp::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 64px; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, #EFE3CB, #D9C49E); filter: brightness(calc(.96 + var(--lamp, 0) * .34)); }
.day-lamp i { position: absolute; left: 50%; bottom: 0; width: 46px; height: 6px; translate: -50% 0; border-radius: 4px 4px 0 0; background: #4E473D; }
.day-light, .day-glow { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.day-glow { opacity: var(--lamp, 0); background: radial-gradient(26% 56% at 95% 46%, rgba(255, 196, 120, .7), transparent 72%); }
.day-panel { position: absolute; z-index: 7; left: max(clamp(16px, 4vw, 32px), calc((100% - 1180px) / 2 + 32px)); top: 50%; translate: 0 -50%; width: min(350px, 30%); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 20px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 34px 60px -34px rgba(0, 0, 0, .45); }
@supports ((-webkit-backdrop-filter: blur(2px)) or (backdrop-filter: blur(2px))) and (color: color-mix(in srgb, red, blue)) {
  .day-panel { background: color-mix(in srgb, var(--surface) 93%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.25); backdrop-filter: blur(18px) saturate(1.25); border-color: color-mix(in srgb, var(--line) 55%, transparent); }
}
.day-panel h2 { font-size: clamp(1.5rem, 1.15rem + 1.2vw, 2.1rem); }
.day-panel p { color: var(--ink-2); }
.day-panel legend, .day-panel .field-label { margin: 0 0 6px; }
.day-panel .day-clock { font-family: var(--font-display); font-size: clamp(3.6rem, 2rem + 5vw, 6.4rem); line-height: .82; font-variant-numeric: tabular-nums; color: var(--ink); }
.day-line { position: relative; height: 2px; margin: 8px 6px 4px; background: var(--line); border-radius: 2px; }
.day-line::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--t, 0) * 100%); background: var(--accent-2); }
.day-line::after { content: ''; position: absolute; left: calc(var(--t, 0) * 100%); top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 22%, transparent); }
.day-panel #day-cap { min-height: 3.1em; color: var(--ink); }

/* chapter three: how it works, measured out on a tape that runs out as the page scrolls; each step shows as the tape reaches it */
.band { display: flex; flex-direction: column; gap: 16px; }
.tape-band { padding-block: clamp(72px, 10vw, 150px) clamp(64px, 9vw, 130px); gap: 22px; }
.lead { font-size: 1.14rem; color: var(--ink-2); max-width: 58ch; }
.tape { position: relative; height: 44px; margin-top: 18px; }
.tape-strip { position: absolute; left: 0; top: 0; bottom: 0; width: calc(8% + 92% * var(--q, 1)); overflow: hidden; border-radius: 0 3px 3px 0; background-color: var(--tape); background-image: repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 10px), repeating-linear-gradient(90deg, var(--tape-ink) 0 2px, transparent 2px 100px); background-size: 100% 9px, 100% 19px; background-repeat: no-repeat; background-position: 0 100%, 0 100%; box-shadow: 0 10px 18px -10px var(--cast); }
.tape-strip::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 9px; background: var(--metal); }
.tape-strip span { position: absolute; top: 5px; font: 600 .72rem/1 var(--font-body); color: var(--tape-ink); padding-left: 5px; }
.steps { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px; counter-reset: s; }
.steps li { counter-increment: s; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; opacity: clamp(.1, calc((var(--q, 1) - var(--at, 0)) * 6), 1); translate: 0 calc((1 - clamp(0, calc((var(--q, 1) - var(--at, 0)) * 6), 1)) * 18px); }
.steps li::before { content: '0' counter(s); font-family: var(--font-display); font-size: 3.2rem; line-height: .9; color: var(--accent-2); }
.steps h3 { font-size: 1.12rem; }
.steps p { color: var(--ink-2); font-size: .96rem; }

/* chapter four: the workshop, in the dark of the frame colour */
.night { background: var(--grain, none), var(--chrome); background-color: var(--chrome); color: var(--chrome-ink); }
.night h2, .night h3 { color: var(--chrome-ink); }
.night p { color: var(--chrome-2); }
.night :focus-visible { outline-color: var(--chrome-ink); }
.rails-band { padding-block: clamp(72px, 10vw, 150px); }
.rails-band .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 6vw, 88px); align-items: start; }
.rails-band .wrap > div:first-child { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.rail-tabs { align-self: stretch; display: flex; flex-direction: column; border-top: 1px solid var(--chrome-line); margin-top: 6px; }
.rail-tab { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--chrome-line); padding: 14px 2px; cursor: pointer; color: var(--chrome-2); font: 400 clamp(1.4rem, 1rem + 1.4vw, 2.1rem)/1.1 var(--font-display); transition: color .25s ease, padding-left .35s cubic-bezier(.2, .7, .2, 1); }
.rail-tab small { font: 600 .78rem/1.2 var(--font-body); text-align: right; }
.rail-tab:hover { color: var(--chrome-ink); padding-left: 8px; }
.rail-tab[aria-pressed="true"] { color: var(--chrome-ink); padding-left: 16px; box-shadow: inset 3px 0 0 var(--chrome-mark); }
.rail-show { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
/* the top of a curtain on its rail, close up: used for the rail on show, the fabric cards and the rail cards */
.art-view { position: relative; align-self: stretch; height: 100%; overflow: hidden; }
.art-cloth { position: absolute; left: 9%; right: 9%; top: 26px; height: 560px; transition: scale .7s cubic-bezier(.2, .7, .2, 1); transform-origin: 50% 0; }
.art-view.k-track::before { content: ''; position: absolute; left: 0; right: 0; top: 20px; height: 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .3)), #A9ABA3; z-index: 2; }
.art-view.is-motor::after { content: ''; position: absolute; left: 3%; top: 13px; width: 15%; height: 28px; border-radius: 5px; background: linear-gradient(180deg, #C4C6BE, #8F9189); z-index: 3; box-shadow: inset -14px 0 0 -11px #3DBE7B; }
.rail-show .art-view { height: clamp(220px, 30vw, 400px); border-radius: 16px; background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03)); -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent); mask-image: linear-gradient(180deg, #000 62%, transparent); animation: railIn .6s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes railIn { from { opacity: 0; translate: 0 -10px; } to { opacity: 1; translate: none; } }
.rail-show h3 { font: 400 1.8rem/1.1 var(--font-display); }
.rail-show .specs { font-size: .95rem; }
.rail-show .specs dt { color: var(--chrome-2); }

/* chapter five: recent work, a strip that slides a little as the page passes and can be pulled through */
.strip-band { padding-top: clamp(72px, 10vw, 150px); gap: 10px; }
.strip { display: flex; align-items: flex-start; gap: 16px; overflow-x: auto; padding: 22px max(clamp(16px, 4vw, 32px), calc((100% - 1180px) / 2 + 32px)) clamp(56px, 8vw, 110px); scroll-snap-type: x proximity; scrollbar-width: thin; }
.strip:focus-visible { outline: 2px solid var(--link); outline-offset: -4px; }
.tile { flex: none; width: clamp(200px, 25vw, 320px); aspect-ratio: 3 / 4; border-radius: 14px; scroll-snap-align: start; position: relative; overflow: hidden; display: flex; align-items: flex-end; translate: calc((1 - var(--q, 1)) * 110px) 0; background-color: var(--art); }
.tile:nth-child(even) { margin-top: 40px; }
.tile span { position: relative; z-index: 1; margin: 10px; padding: 5px 11px; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: .8rem; font-weight: 600; }

/* the last scene: night, and the curtains draw as the page ends */
.closing { position: relative; overflow: clip; padding-block: clamp(96px, 14vw, 200px); }
.closing::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 9px; z-index: 2; background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .35)), var(--metal); }
.closing-drape { position: absolute; top: 6px; bottom: 0; width: calc(6% + 23% * var(--q, 0)); --fab: #96553A; --n: 5; filter: drop-shadow(0 0 26px rgba(0, 0, 0, .4)); }
.closing-drape.l { left: 0; }
.closing-drape.r { right: 0; }
.closing-in { position: relative; z-index: 1; width: min(660px, 40%); margin-inline: auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px; }
.closing h2 { font-size: clamp(2.2rem, 1.3rem + 3.8vw, 4.6rem); line-height: .98; }
.closing .btn-row { justify-content: center; }
.closing .btn { border-radius: 999px; padding: 13px 24px; }
.contact dl { display: grid; grid-template-columns: auto auto; gap: 6px 16px; justify-content: center; text-align: left; font-size: .95rem; }
.contact dt { color: var(--chrome-2); }
.contact dd { margin: 0; overflow-wrap: anywhere; }
.contact a { color: var(--chrome-ink); }

/* fabric drawing */
.fab { background: linear-gradient(90deg, rgba(0, 0, 0, .22), rgba(255, 255, 255, .2) 50%, rgba(0, 0, 0, .22)) 0 0 / calc(100% / var(--n, 8)) 100% repeat-x, var(--fab, #ccc); }
.fab.sheer { background: linear-gradient(90deg, rgba(70, 80, 90, .12), rgba(255, 255, 255, .6) 50%, rgba(70, 80, 90, .12)) 0 0 / calc(100% / var(--n, 8)) 100% repeat-x, var(--fab, #eee); }
.card-drape { height: 220px; overflow: hidden; background: var(--grain, none), var(--art); background-color: var(--art); }
.card:hover .art-cloth { scale: 1.04; }
.incl { list-style: none; padding: 0; display: flex; flex-direction: column; font-size: .92rem; }
.incl li { padding: 6px 0; border-bottom: 1px solid var(--line); }

/* cards and grids */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: var(--bw) solid var(--field-line); background: var(--surface); border-radius: var(--r-btn); padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: .9rem; }
.tag[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag.small { padding: 4px 10px; font-size: .78rem; white-space: nowrap; }
.tag.small b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card-body .btn { margin-top: auto; align-self: flex-start; }
.card-body .specs { margin-block: 4px 10px; }
.card-title { font-size: 1.55rem; line-height: 1.1; }
.eyebrow { font-size: .85rem; color: var(--ink-2); }
.specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: .9rem; }
.specs dt { color: var(--ink-2); }
.specs dd { margin: 0; overflow-wrap: anywhere; }

/* tables */
.scroll-x { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .9rem; background: var(--surface); }
table.data th, table.data td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.data thead th { font-size: .82rem; color: var(--ink-2); border-bottom: var(--bw) solid var(--ink); }
table.data .num { text-align: right; }
table.data td.yes { color: var(--good); font-weight: 700; }
table.data td.no { color: var(--ink-2); }
table.cal { min-width: 860px; }
table.sticky-col thead th:first-child, table.sticky-col tbody th[scope="row"] { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
table.cal td.free { color: var(--ink-2); font-size: .82rem; }
table.cal td.busy { background: var(--warn-bg); color: var(--warn); }
table.cal td.done { background: var(--surface-2); color: var(--ink-2); }
.scroll-x:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* panels and forms */
.panel { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.panel > h2 { font-size: 1.6rem; }
.form { gap: 18px; }
.form.book, .form.track { max-width: 640px; }

      case 'stock-part': Ops.receivePart(st, el.getAttribute('data-id'), 50); refreshOps(el.id); break;
    }
  });

  function onField(el, isChange) {
    var f = el.getAttribute('data-f'), k = el.getAttribute('data-k'), v = el.value, o = S.ops.open ? orderById(S.ops.open) : null, i = Number(el.getAttribute('data-i')), w, r;
    if (el.getAttribute('data-off')) { // reached with the keyboard: the real choice is put back
      if (S.view === 'config') refreshConfig(true); else if (S.view === 'book') setHTML($('book-slots'), slotsHtml());
      return;
    }
    switch (f) {
      case 'car-color': // the curtain on the rail and the room preview take the new colour; nothing else is redrawn
        var cx = smp(), cf = famFabric(cx.fam, v); S.car.col[cx.id] = cf.id;
        var sl = $('slide-' + S.car.i); if (sl) { sl.setAttribute('data-fab', cf.hex); sl.style.setProperty('--fab', cf.hex); }
        FX.stage.recolor(S.car.i); paintAmbient(); setHTML($('stage-word'), wordHtml());
        var cn = $('car-col-name'); if (cn) cn.textContent = colorName(cf);
        var cs0 = $('car-stock'); if (cs0) { cs0.className = (cf.stock ? 'ok' : 'warn') + '-text'; cs0.textContent = stockText(cf); }
        setHTML($('look'), lookScene()); say(t('car.color') + ': ' + colorName(cf) + '. ' + stockText(cf)); break;
      case 'look-wall': S.car.wall = v; ['look', 'day'].forEach(function (id2) { var lw = $(id2); if (lw) lw.style.setProperty('--wall', wallHex()); }); break;
      case 'cat-color':
        var kf = famFabric(k, v); S.catCol[k] = kf.id;
        var ka = $('cat-art-' + k), ks = ka && ka.querySelector('canvas.cloth'); if (ks) { ks.setAttribute('data-hex', kf.hex); FX.dress(ka); }
        var kn = $('cat-col-' + k); if (kn) kn.textContent = colorName(kf);
        var kt = $('cat-stock-' + k); if (kt) { kt.className = (kf.stock ? 'ok' : 'warn') + '-text'; kt.textContent = stockText(kf); }
        say(kf[S.lang] + ', ' + colorName(kf) + '. ' + stockText(kf)); break;
      case 'sheerFam': case 'mainFam': // a new fabric starts on its first colour
        S.cfg[f === 'sheerFam' ? 'sheerId' : 'mainId'] = familyOf(v)[0].id; S.added = false;
        settle(f); refreshConfig(true); sayFabric(familyOf(v)[0]); break;
      case 'open': S.open = Number(v); var cs = $('cfg-scene-el'); if (cs) cs.style.setProperty('--open', (S.open / 100).toFixed(2)); break;
      case 'room': S.room = v; break;
      case 'width': case 'height':
        var nv = num(v);
        if (isChange && (nv === S.cfg[f] || (isNaN(nv) && isNaN(S.cfg[f])))) break; // already applied while typing
        S.cfg[f] = nv; S.added = false; refreshConfig(false); break;
      case 'mode': case 'layers': case 'heading': case 'mount': case 'rail': case 'sheerId': case 'mainId': case 'shape': case 'panels':
        S.cfg[f] = f === 'panels' ? Number(v) : v; S.added = false;
        settle(f);
        refreshConfig(true); if (f === 'sheerId' || f === 'mainId') sayFabric(fabricById(v)); break;
      case 'b-name': S.book.name = v; clearFixed('name'); break;
      case 'b-phone': S.book.phone = v; clearFixed('phone'); break;
      case 'b-email': S.book.email = v; clearFixed('email'); break;
      case 'b-address': S.book.address = v; clearFixed('address'); break;
      case 'b-notes': S.book.notes = v; break;
      case 'b-hp': S.book.hp = v; break;
      case 'b-consent': S.book.consent = el.checked; clearFixed('consent'); break;
      case 'b-callback': S.book.callback = el.checked; delete S.book.errors.slot; setHTML($('book-slots'), slotsHtml()); break;
      case 'b-zone': S.zone = v; saveEst(); delete S.book.errors.slot; setHTML($('book-slots'), slotsHtml()); setHTML($('book-attached'), attachedText()); break;
      case 'bday': S.book.day = v; if (S.book.slot.split('|')[0] !== v) S.book.slot = ''; setHTML($('book-slots'), slotsHtml()); break;
      case 'slot':
        S.book.slot = v; delete S.book.errors.slot; setHTML($('book-slots'), slotsHtml());
        say(t('book.chosen', { date: fmtDate(v.split('|')[0], 'day'), slot: t('slot.' + v.split('|')[1]) })); break;
      case 't-code': S.track.code = v; break;
      case 't-pin': S.track.pin = v; break;
      case 'lead': S.ops.lead[k] = v; break;
      case 'od-draft': S.ops.drafts[k] = v; break;
      case 'od-contact': if (S.ops.contact) S.ops.contact[k] = v; break;
      case 'od-pick': S.ops.drafts[k] = v; if (isChange) refreshOps(el.id); break; // which slots are taken depends on the day and team picked
      case 'od-room': if (o) Ops.setWindowField(st, o, i, 'room', v, !isChange); break;
      case 'od-size':
        if (!o || !Ops.editable(o) || !o.windows[i] || isChange) break; // applied while typing; only the parts that depend on it are redrawn, so a tap already on its way is not lost
        w = o.windows[i];
        var hadManual = w.manual !== null;
        Ops.setWindowField(st, o, i, k, num(v), !!S.ops.sizeLogged[i + k]); S.ops.sizeLogged[i + k] = true;
        S.ops.flash = hadManual ? t('flash.manualCleared') : '';
        if (hadManual) { delete S.ops.drafts['man' + i]; say(S.ops.flash); }
        S.ops.err['man' + i] = false;
        setHTML($('od-manrow-' + i), manRowHtml(w, i)); setHTML($('od-log'), logHtml(o));
        var vb = $('od-v-' + i); if (vb) vb.checked = false;
        var bad = Pricing.computeWindow(w.cfg).errors.some(function (e) { return e.indexOf(k) === 0; });
        if (bad) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid');
        var ve = $('od-ver-err-' + i); if (ve) ve.textContent = ''; S.ops.err['ver' + i] = false;
        var di = $('od-discount'); if (di && S.ops.drafts.discount === undefined) di.value = o.discount || '';
        setHTML($('od-wsum-' + i), wsumHtml(w)); setHTML($('od-next'), nextHtml(o)); setHTML($('od-est'), estNowHtml(o)); setHTML($('od-foot'), footHtml(o));
        break;
      case 'od-cfg':
        if (!o) break;
        r = Ops.setWindowField(st, o, i, k, v);
        S.ops.notes[i] = r.ok ? changeNote(r.changed) : ''; S.ops.err['ver' + i] = false;
        refreshOps(el.id, ''); break;
      case 'od-substrate': if (o) { Ops.setWindowField(st, o, i, 'substrate', v); refreshOps(el.id, ''); } break;
      case 'od-verified':
        if (!o) break;
        r = Ops.setVerified(st, o, i, el.checked);
        S.ops.err['ver' + i] = !r.ok;
        refreshOps(el.id, ''); break;
      case 'od-flag': if (o) { r = Ops.workFlag(st, o, i, k, el.checked); refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-signoff': if (o) { r = Ops.setSignoff(st, o, el.checked); refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-accepted': if (o) { r = Ops.setAccepted(st, o, el.checked); if (r.ok) S.ops.err.deposit = null; refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-longlead': if (o) { r = Ops.setLongLead(st, o, el.checked); if (r.ok) S.ops.err.deposit = null; refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-hold': if (o) { r = Ops.setHold(st, o, v); S.ops.err.deposit = null; refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
    }
  }
  document.addEventListener('input', function (ev) { var el = ev.target.closest('[data-f]'); if (el && (el.type === 'text' || el.type === 'tel' || el.type === 'range' || el.tagName === 'TEXTAREA')) onField(el, false); });
  document.addEventListener('change', function (ev) { var el = ev.target.closest('[data-f]'); if (el && el.type !== 'range') onField(el, true); });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'book-form') submitBooking();
    if (ev.target.id === 'track-form') {
      S.track.result = Ops.findForTracking(st, S.track.code, S.track.pin);
      setHTML($('track-out'), trackResult());
      var res = $('track-res');
      if (res) { res.focus({ preventScroll: true }); if (res.scrollIntoView) res.scrollIntoView({ block: 'nearest' }); say(S.track.result.order ? S.track.result.order.code + ': ' + t('c.' + S.track.result.order.status) : t('track.notFound')); }
    }
    if (ev.target.id === 'lead-form') {
      var ld = S.ops.lead, r = Ops.createStaffLead(st, { name: ld.name, phone: ld.phone, address: ld.address, notes: ld.notes, zone: ld.zone, source: ld.source });
      if (!r.ok) { ld.err = true; refreshOps(r.error === 'phone' ? 'lead-phone' : 'lead-name'); say(t('ops.e.lead')); return; }
      S.ops.lead = emptyLead(); S.ops.leadOpen = false;
      openDrawer(r.order.id, 'card-' + r.order.id);
      S.ops.flash = t('flash.lead'); setHTML($('od-foot'), footHtml(r.order)); say(S.ops.flash);
    }
  });
  // The display rail is pulled and brushed through the experience layer; from its two buttons it also answers to the arrow keys.
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && ev.target && ev.target.classList && ev.target.classList.contains('arrow')) {
      ev.preventDefault(); carGo(S.car.i + (ev.key === 'ArrowRight' ? 1 : -1));
      var ab = $(ev.key === 'ArrowRight' ? 'car-next' : 'car-prev'); if (ab) ab.focus();
      return;
    }
    var enter = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-enter');
    if (ev.key === 'Enter' && enter) { // Enter in an amount or invoice field presses the button next to it
      var btn = $(enter); if (btn) { ev.preventDefault(); btn.click(); }
      return;
    }
    if (ev.key === 'Escape' && S.menu) { setMenu(false, true); return; }
    if (!S.ops.open) return;
    if (ev.key === 'Escape') { closeDrawer(); return; }
    if (ev.key === 'Tab') { // keep focus inside the dialog
      var d = $('drawer'); if (!d) return;
      var f = d.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,a[href]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1], a = document.activeElement;
      var afterLast = d.contains(a) && a !== last && !!(last.compareDocumentPosition(a) & 4); // e.g. the status line in the footer
      if (ev.shiftKey && (a === first || !d.contains(a))) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && (a === last || afterLast || !d.contains(a))) { ev.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener('hashchange', function () {
    var v = location.hash.replace('#', '') || 'home';
    if (closing) { // the step back after closing an order has arrived
      closing = false; if (closingTimer) clearTimeout(closingTimer);
      if (S.ops.open && v === 'ops') { setHash('ops-' + S.ops.open); S.ops.pushed = true; } // another order was opened meanwhile
      return;
    }
    if (v.indexOf('ops-') === 0) {
      var id = v.slice(4);
      if (!orderById(id)) return;
      if (S.view !== 'ops') { S.view = 'ops'; render(); }
      if (S.ops.open !== id) openDrawer(id, 'card-' + id, true);
      return;
    }
    if (S.ops.open && v === 'ops') { closeDrawer(true); return; } // Back from an open order
    if (VIEWS.indexOf(v) >= 0 && v !== S.view) go(v, true);
  });
  window.addEventListener('resize', function () {
    var top = $('page-top');
    if (top) root.style.setProperty('--top-h', (getComputedStyle(top).position === 'sticky' ? top.offsetHeight : 0) + 'px');
    var mb = $('menu-btn'); if (S.menu && mb && getComputedStyle(mb).display === 'none') setMenu(false); // the wide layout has no menu to keep open
    topState();
  });
  window.addEventListener('scroll', topState, { passive: true });

  /* ----- boot ----- */
  loadPrefs();
  var start = '';
  try { start = location.hash.replace('#', ''); } catch (e) { start = ''; }
  S.view = VIEWS.indexOf(start) >= 0 ? start : start.indexOf('ops-') === 0 && !PUBLIC_ONLY ? 'ops' : 'home';
  if (S.view === 'ops' && start.indexOf('ops-') === 0 && orderById(start.slice(4))) S.ops.open = start.slice(4);
  if (!start || (S.view === 'home' && start !== 'home')) { try { history.replaceState(null, '', '#' + S.view); } catch (e) { /* the first Back then leaves the page */ } }
  try { if (S.view === 'ops' || sessionStorage.getItem('pn.intro')) root.classList.add('intro-done'); else sessionStorage.setItem('pn.intro', '1'); } catch (e) { /* it simply plays */ }
  FX.dress($('intro'));
  render();
  if (S.ops.open) { var oc = $('od-close'); if (oc) oc.focus(); }
})();
</script>
