<title>Perde Nemis Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a dark-teal top bar, then one view at a time. The home page is a walk through a day at the window, in
   full-width chapters: curtains hanging from one rail (they sway, and can be pulled along it), a room where the
   light moves from morning to night as the page scrolls, the workshop, and a closing scene where the curtains draw.
   The other views sit in a centred column.
   The palette (data-design on the root element), light or dark (data-mode) and the language only swap tokens and strings.
   Each of the six combinations is a deliberate look, so the page sets every colour itself. */
:root {
  color-scheme: only light; /* "only": a phone browser's own dark theme must not recolour the page, or cloth and swatches stop matching */
  /* Pishë: dark teal with sand. Teal carries the frame of the page; fabrics hang on a warm neutral. */
  --bg: #ECE6DA; --surface: #F8F4EC; --surface-2: #DFD7C7; --ink: #17292B; --ink-2: #4D5B58; --line: #CDC3B0; --field-line: #7B8580;
  --accent: #17474A; --accent-ink: #F6F0E4; --accent-2: #8F4E30; --link: #1A5559; --btn-line: #17474A;
  --chrome: #143E41; --chrome-ink: #F3ECDE; --chrome-2: #C2CEC6; --chrome-line: #2C5B5E; --chrome-mark: #D9B98A;
  --good: #2A6A45; --good-bg: #DCEADB; --warn: #7A5200; --warn-bg: #F3E4BE; --bad: #A33A28; --bad-bg: #F3DAD1;
  --wall: #E6DFD1; --floor: #C9BEA8; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #8B8D86;
  --ground: #D6CCB8; --spot: rgba(255, 252, 244, .6); --cast: rgba(40, 34, 22, .3); --art: #DFD7C7; --tape: #DDB565; --tape-ink: #2A2118;
  --font-display: 'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body: 'Albert Sans', 'Segoe UI', system-ui, sans-serif;
  --font-data: 'Albert Sans', 'Segoe UI', system-ui, sans-serif;
  --r: 14px; --r-btn: 999px; --bw: 1px;
  --shadow: none;
}
:root[data-design="toke"] {
  color-scheme: only light;
  /* Tokë: the same teal frame, with clay doing the calling. Warmer and more earthen. */
  --bg: #EFE5D8; --surface: #FAF4EA; --surface-2: #E3D5C2; --ink: #2A211B; --ink-2: #5A4E44; --line: #D3C2AC; --field-line: #857768;
  --accent: #9A4E32; --accent-ink: #FFF7EC; --accent-2: #1F5054; --link: #1C5357; --btn-line: #9A4E32;
  --chrome: #1B4A4D; --chrome-ink: #F6ECDD; --chrome-2: #C7D2C9; --chrome-line: #366467; --chrome-mark: #E0A583;
  --good: #2A6A45; --good-bg: #DDE9D6; --warn: #7A5200; --warn-bg: #F4E3B9; --bad: #A33A28; --bad-bg: #F4D9CE;
  --wall: #E9DCCB; --floor: #C6B299; --sky1: #C8DDE2; --sky2: #F4F1E8; --frame: #FCF8F0; --metal: #8F867A;
  --ground: #D8C6AD; --spot: rgba(255, 250, 240, .6); --cast: rgba(60, 38, 20, .3); --art: #E3D5C2; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-mode="dark"] {
  color-scheme: dark;
  /* Pishë, dark: the same teal, now the ground, with sand doing the calling. */
  --bg: #0F2A2C; --surface: #16383A; --surface-2: #1E4547; --ink: #EFE9DC; --ink-2: #B3C1B9; --line: #2B5254; --field-line: #7A9A96;
  --accent: #E6DCC6; --accent-ink: #12302F; --accent-2: #DB9A73; --link: #9ED4CC; --btn-line: #E6DCC6;
  --chrome: #0A2022; --chrome-ink: #F3ECDE; --chrome-2: #A9B9B0; --chrome-line: #23464A; --chrome-mark: #D9B98A;
  --good: #8FD3A6; --good-bg: #1D4133; --warn: #EBC878; --warn-bg: #3F3A1E; --bad: #F2A090; --bad-bg: #4A2A26;
  --wall: #D8D0C0; --floor: #B5A88F; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #A9ABA3;
  --ground: #091F21; --spot: rgba(255, 236, 200, .16); --cast: rgba(0, 0, 0, .55); --art: #CFC7B6; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-design="toke"][data-mode="dark"] {
  color-scheme: dark;
  /* Tokë, dark: earth-brown ground under the teal bar, clay doing the calling. */
  --bg: #251B15; --surface: #30241C; --surface-2: #3C2E24; --ink: #F4EADB; --ink-2: #CDBDAA; --line: #4E3D30; --field-line: #A08D79;
  --accent: #D67F58; --accent-ink: #1F120B; --accent-2: #86C2BB; --link: #8ECFC7; --btn-line: #D67F58;
  --chrome: #153537; --chrome-ink: #F6ECDD; --chrome-2: #B9C8BF; --chrome-line: #2C5356; --chrome-mark: #E0A583;
  --good: #9AD6A9; --good-bg: #24402D; --warn: #EBC878; --warn-bg: #45391C; --bad: #F3A693; --bad-bg: #4E2A24;
  --wall: #DCCFBD; --floor: #B39C82; --sky1: #C8DDE2; --sky2: #F4F1E8; --frame: #FCF8F0; --metal: #B9A27E;
  --ground: #1A120D; --spot: rgba(255, 214, 160, .16); --cast: rgba(0, 0, 0, .55); --art: #D3C5B0; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-design="nate"][data-mode="light"] {
  color-scheme: only light;
  /* Natë, light: sand ground under the deepest teal bar, with ochre doing the calling. */
  --bg: #EEE8DB; --surface: #F9F5EC; --surface-2: #E0D8C6; --ink: #14292B; --ink-2: #4C5A57; --line: #CEC4AF; --field-line: #7B8580;
  --accent: #CFA25A; --accent-ink: #1E1609; --accent-2: #7E5210; --link: #1A5559; --btn-line: #8A6A2A;
  --chrome: #0B2325; --chrome-ink: #F0E8D8; --chrome-2: #A9B9B0; --chrome-line: #24484A; --chrome-mark: #D7AE74;
  --good: #2A6A45; --good-bg: #DCEADB; --warn: #7A5200; --warn-bg: #F3E4BE; --bad: #A33A28; --bad-bg: #F3DAD1;
  --wall: #E6DFD1; --floor: #C9BEA8; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #B59A62;
  --ground: #D6CCB8; --spot: rgba(255, 252, 244, .6); --cast: rgba(40, 34, 22, .3); --art: #DFD7C7; --tape: #DDB565; --tape-ink: #2A2118;
}
:root[data-design="nate"][data-mode="dark"] {
  color-scheme: dark;
  /* Natë, dark (the form it was designed in): dark teal all the way through, with ochre light. The showroom after hours. */
  --bg: #102F31; --surface: #173C3F; --surface-2: #1F494C; --ink: #F0E8D8; --ink-2: #B5C2B8; --line: #2D5759; --field-line: #7A9A96;
  --accent: #D7AE74; --accent-ink: #1E1609; --accent-2: #CF8562; --link: #E3C08E; --btn-line: #D7AE74;
  --chrome: #0B2325; --chrome-ink: #F0E8D8; --chrome-2: #A9B9B0; --chrome-line: #24484A; --chrome-mark: #D7AE74;
  --good: #8FD3A6; --good-bg: #1D4133; --warn: #EBC878; --warn-bg: #3F3A1E; --bad: #F2A090; --bad-bg: #4A2A26;
  --wall: #D8D0C0; --floor: #B5A88F; --sky1: #C5DCE4; --sky2: #F2F3EC; --frame: #FBF8F1; --metal: #C2A873;
  --ground: #0A2325; --spot: rgba(255, 214, 150, .17); --cast: rgba(0, 0, 0, .55); --art: #CFC7B6; --tape: #D7AE74; --tape-ink: #1E1609;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h, 0px) + 12px); scroll-padding-bottom: 76px; }
:root.drawer-open, :root.drawer-open body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 400; letter-spacing: -.005em; }
h1 { font-size: clamp(2.3rem, 1.3rem + 4.2vw, 4.6rem); line-height: 1; }
h2 { font-size: clamp(1.9rem, 1.3rem + 2.4vw, 3.2rem); line-height: 1.04; }
h3 { font-size: 1.05rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p, dl, ul, ol { margin: 0; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.ok-text { color: var(--good); font-size: .88rem; font-weight: 600; }
.warn-text { color: var(--warn); font-size: .88rem; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
bdi { unicode-bidi: isolate; }

/* top bar: clear over the opening scene, solid as soon as the page moves and on every other view */
.top { position: relative; z-index: 20; background: var(--chrome); color: var(--chrome-ink); --tk: var(--chrome-ink); --tk2: var(--chrome-2); --tbg: var(--chrome); --tmark: var(--chrome-mark); transition: background-color .35s ease; }
@media (min-height: 600px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); } }
/* over the cover the bar is clear: the picture's own pelmet stands behind its words */
/* a hair short of opaque: a fully opaque bar makes some browsers skip painting the live canvas it passes over */
@supports (color: color-mix(in srgb, red, blue)) { .top { background: color-mix(in srgb, var(--chrome) 99.6%, transparent); } }
:root.top-clear .top { background: transparent; }
.top-row { display: flex; align-items: center; gap: 8px 18px; min-height: 64px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; flex: none; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-display); font-size: 1.7rem; font-weight: 400; letter-spacing: .01em; color: var(--tk); transition: color .35s ease; }
.brand svg { width: 30px; height: 30px; color: var(--tmark); flex: none; }
.top :focus-visible { outline-color: var(--tk); }
.menu { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
#nav { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.navlink { position: relative; white-space: nowrap; background: none; border: 0; padding: 9px 11px; cursor: pointer; color: var(--tk2); font-weight: 500; font-size: .93rem; transition: color .2s ease; }
.navlink::after { content: ''; position: absolute; left: 11px; right: 11px; bottom: 4px; height: 1px; background: currentColor; scale: 0 1; transform-origin: 0 50%; transition: scale .3s cubic-bezier(.2, .7, .2, 1); }
.navlink:hover, .navlink[aria-current="page"] { color: var(--tk); }
.navlink:hover::after, .navlink[aria-current="page"]::after { scale: 1 1; }
#nav-home { display: none; } /* the name in the corner is the way home; the link shows in the full-screen menu */
.btn.top-cta { flex: none; background: var(--tk); color: var(--tbg); border-color: var(--tk); border-radius: 999px; padding-inline: 16px; transition: background-color .35s ease, color .35s ease; }
.btn.top-cta[aria-current="page"] { background: transparent; color: var(--tk); }
.l-short { display: none; }
@media (max-width: 430px) { .l-full { display: none; } .l-short { display: inline; } }
#controls { display: flex; align-items: center; gap: 10px; flex: none; }
.seg { display: inline-flex; border: var(--bw) solid var(--field-line); border-radius: var(--r-btn); overflow: hidden; background: var(--surface); }
.seg-btn { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-size: .82rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
.seg-btn[aria-pressed="true"]:focus-visible { outline-color: var(--bg); }
.seg-btn i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(128, 128, 128, .6); }
.sw-pishe i { background: linear-gradient(135deg, #ECE6DA 50%, #17474A 50%); }
.sw-toke i { background: linear-gradient(135deg, #17474A 50%, #9A4E32 50%); }
.sw-nate i { background: linear-gradient(135deg, #102F31 50%, #D7AE74 50%); }
.top .seg { border: 0; background: none; overflow: visible; gap: 2px; }
.top .seg-btn { color: var(--tk2); padding: 6px; font-size: .78rem; border-radius: 999px; }
.top .seg-btn[aria-pressed="true"] { background: none; color: var(--tk); text-decoration: underline; text-underline-offset: 5px; }
.top .seg-btn[aria-pressed="true"] i { outline: 1.5px solid var(--tk); outline-offset: 2px; }
.top .seg-btn:focus-visible { outline: 2px solid var(--tk); outline-offset: 0; }
.top .seg-btn .nm { display: none; }
/* light or dark: one switch, the mode in use filled in */
.top .seg.mode { border: 1px solid var(--tk2); border-radius: 999px; padding: 2px; gap: 0; }
.top .seg.mode .seg-btn { padding: 5px 8px; gap: 5px; }
.top .seg.mode .seg-btn svg { width: 16px; height: 16px; display: block; }
.top .seg.mode .seg-btn[aria-pressed="true"] { background: var(--tk); color: var(--tbg); text-decoration: none; }
.noscript { padding-block: 40px; font-size: 1.05rem; }
.menu-btn { display: none; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--tk2); background: none; cursor: pointer; place-items: center; color: var(--tk); padding: 0; }
.menu-bars { position: relative; width: 18px; height: 10px; display: block; }
.menu-bars::before, .menu-bars::after { content: ''; position: absolute; left: 0; right: 0; height: 1.5px; background: currentColor; transition: transform .3s cubic-bezier(.2, .7, .2, 1), top .3s ease; }
.menu-bars::before { top: 0; }
.menu-bars::after { top: 8.5px; }
:root.menu-open .menu-bars::before { top: 4px; transform: rotate(45deg); }
:root.menu-open .menu-bars::after { top: 4px; transform: rotate(-45deg); }
:root.menu-open, :root.menu-open body { overflow: hidden; }
.demo-note { font-size: .8rem; color: var(--chrome-2); flex: 1 1 100%; max-width: 90ch; opacity: .85; }

main { padding-block: 44px 88px; display: flex; flex-direction: column; gap: 56px; outline: none; }
main.view-home, main.paged { display: block; padding-block: 0; }
.view-body { display: flex; flex-direction: column; gap: 56px; padding-block: 48px 96px; }
.page-head { position: relative; background: var(--grain, none), var(--surface-2); background-color: var(--surface-2); overflow: hidden; }
.page-head::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .3)), var(--metal); z-index: 3; }
.page-head-in { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px clamp(24px, 5vw, 72px); align-items: end; min-height: clamp(220px, 30vw, 340px); }
.page-head .view-head { padding-block: clamp(40px, 6vw, 84px) clamp(28px, 4vw, 52px); }
.page-rail { align-self: stretch; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 20px); -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
.page-rail .art-view::before { display: none; }
.page-rail .art-cloth { left: 0; right: 0; top: 8px; }
.page-rail .art-view:nth-child(2) .art-cloth { top: 8px; }
@keyframes viewIn { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: none; } }
main.is-entering { animation: viewIn .45s cubic-bezier(.2, .7, .2, 1) both; }
/* a change of page: the new page opens over the old one from the middle, like two curtains parting */
:root.vt::view-transition-old(root) { animation: none; mix-blend-mode: normal; }
:root.vt::view-transition-new(root) { animation: vtOpen .44s cubic-bezier(.7, 0, .2, 1) both; mix-blend-mode: normal; }
@keyframes vtOpen { from { clip-path: inset(0 50% 0 50%); } to { clip-path: inset(0 0 0 0); } }
main.view-home.is-entering { animation-name: viewFade; }
@keyframes viewFade { from { opacity: 0; } to { opacity: 1; } }
.view-head { display: flex; flex-direction: column; gap: 14px; padding-bottom: 6px; }
.view-head p { color: var(--ink-2); max-width: 62ch; font-size: 1.08rem; }
.foot { background: var(--grain, none), var(--chrome); background-color: var(--chrome); color: var(--chrome-2); font-size: .85rem; border-top: 1px solid var(--chrome-line); }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px 24px; padding-block: 26px 34px; }
.foot b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: var(--chrome-ink); }
/* things that come in as they are reached; only where the experience layer has said it will bring them in */
:root.fx .rv { opacity: 0; translate: 0 26px; transition: opacity .8s ease var(--d, 0s), translate .9s cubic-bezier(.2, .7, .2, 1) var(--d, 0s); }
:root.fx .rv.in { opacity: 1; translate: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 22px; border-radius: var(--r-btn); border: var(--bw) solid var(--btn-line); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; line-height: 1.2; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.inv { background: var(--chrome-ink); color: var(--chrome); border-color: var(--chrome-ink); }
.btn.ghost.inv { background: transparent; color: var(--chrome-ink); border-color: var(--chrome-ink); }
.btn.small { padding: 7px 13px; font-size: .86rem; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.btn.ghost.danger { background: transparent; color: var(--bad); }
.btn[disabled] { background: var(--surface-2); color: var(--ink-2); border-color: var(--field-line); border-style: dashed; cursor: not-allowed; filter: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; font-size: .86rem; text-align: left; }

/* The home page is one room. It is painted on the graphics card and held on the screen, and the six parts of the page
   pass over it: where the page stands decides where the eye is, how far the curtains are open and what hour it is.
   Each part is a tall block; what it says stays at the foot of the screen (beside the picture on a wide one) while the
   block passes, so the page is read by scrolling, as any page is. */
.film { position: relative; margin-top: calc(var(--top-h, 0px) * -1); background: #0C2426; }
.film::after { content: ''; display: block; }
.film-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; touch-action: pan-y pinch-zoom; -webkit-user-select: none; user-select: none; cursor: grab; --sky1: #E6F1F4; --sky2: #FFF9EA; --cfloor: #C4B292; --q: .2; }
:root[data-mode="dark"] .film-stage { --sky1: #232C48; --sky2: #D29A6C; --cfloor: #5F5546; }
.film-stage.is-pull { cursor: grabbing; }
.film-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
.film.gl .film-gl { display: block; }
.film.gl .cover-art { display: none; }
.film.no-gl .film-stage { background: linear-gradient(180deg, var(--sky1), var(--sky2) 80%); cursor: default; }
/* the track gives the page its length; the words lie over the picture and change with the part the page has reached */
.film-track { position: relative; margin-top: -100vh; margin-top: -100svh; pointer-events: none; }
.shot { height: calc(var(--len, 2) * 100vh); height: calc(var(--len, 2) * 100svh); }
.film-caps { position: sticky; top: 0; z-index: 2; height: 100vh; height: 100svh; margin-top: -100vh; margin-top: -100svh; pointer-events: none; }
.cap { position: absolute; inset: 0; box-sizing: border-box; padding-top: var(--top-h, 0px); display: flex; align-items: flex-end; opacity: 0; translate: 0 14px; transition: opacity .34s ease, translate .44s cubic-bezier(.2, .7, .2, 1); }
.cap.is-on { opacity: 1; translate: none; z-index: 1; }
.cap:not(.is-on) * { pointer-events: none !important; }

/* what the parts say. On a narrow screen a sheet at the foot of the picture; on a wide one a panel at its side.
   A hair short of opaque, like the top bar: a fully opaque block over the live canvas makes some browsers skip painting it. */
.cap-panel { pointer-events: auto; width: 100%; box-sizing: border-box; max-height: calc(100vh - var(--top-h, 0px) - 34px); max-height: calc(100svh - var(--top-h, 0px) - 34px); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); color: var(--ink); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 18px clamp(16px, 4vw, 28px) max(18px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -22px 60px -34px rgba(0, 0, 0, .55); }
@supports (color: color-mix(in srgb, red, blue)) { .cap-panel { background: color-mix(in srgb, var(--surface) 99.4%, transparent); } }
.cap-panel h2 { font-size: clamp(1.5rem, 1.2rem + 1.1vw, 2.1rem); line-height: 1.02; }
.cap-panel p { color: var(--ink-2); font-size: .95rem; }
.cap-free { pointer-events: none; }
.cap-free a, .cap-free button { pointer-events: auto; }
@media (min-width: 901px) {
  .cap { align-items: center; }
  .cap-panel { width: min(410px, 34vw); margin-left: max(clamp(16px, 4vw, 32px), calc((100% - 1180px) / 2 + 32px)); border: 1px solid var(--line); border-radius: 22px; padding: 26px 26px 24px; gap: 13px; box-shadow: 0 34px 70px -34px rgba(0, 0, 0, .55); }
}

/* where the page stands in the film, and the way to any part of it */
.film-dots { position: absolute; left: 0; right: 0; top: calc(var(--top-h, 0px) + 22px); z-index: 3; display: flex; justify-content: center; gap: 0; pointer-events: none; }
.film-dot { pointer-events: auto; flex: none; width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.film-dot::before { content: ''; width: 7px; height: 7px; border-radius: 7px; background: rgba(255, 255, 255, .62); box-shadow: 0 0 0 1px rgba(0, 0, 0, .28); transition: width .3s ease, height .3s ease, background-color .3s ease; }
.film-dot[aria-current]::before { width: 20px; background: #fff; }
@media (min-width: 901px) { .film-dots { left: auto; right: 6px; top: 50%; translate: 0 -50%; flex-direction: column; } .film-dot[aria-current]::before { width: 7px; height: 20px; } }
.film-dot:focus-visible { outline: 2px solid #fff; outline-offset: -4px; border-radius: 50%; }

/* part one: the heading, on the cloth */
.cover-text { width: 100%; padding-bottom: clamp(26px, 7vh, 76px); display: flex; flex-direction: column; gap: 16px; align-items: flex-start; opacity: clamp(0, calc(1 - var(--q, 0) * 1.5), 1); translate: 0 calc(var(--q, 0) * -40px); }
.cover-text h1 { font-size: clamp(2.7rem, 1.2rem + 7vw, 6.6rem); line-height: .94; letter-spacing: -.015em; max-width: 13ch; color: #FBF5E8; text-shadow: 0 2px 28px rgba(0, 0, 0, .45); }
.cover-text p { font-size: clamp(1rem, .9rem + .5vw, 1.25rem); max-width: 40ch; color: #EFE7D6; text-shadow: 0 1px 14px rgba(0, 0, 0, .55); }
.cap-open .btn, .cap-close .btn { padding: 13px 24px; }
.cap-open .btn.inv, .cap-close .btn.inv { background: #F6EFE0; color: #12302F; border-color: #F6EFE0; }
.cap-open .btn.ghost.inv, .cap-close .btn.ghost.inv { background: rgba(6, 22, 24, .34); color: #F6EFE0; border-color: #F6EFE0; }
.cap-open :focus-visible, .cap-close :focus-visible { outline-color: #F6EFE0; }
.film.first .cover-text > * { animation: coverRise .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: 1.15s; }
.film.first .cover-text > p { animation-delay: 1.3s; }
.film.first .cover-text > .btn-row { animation-delay: 1.45s; }
@keyframes coverRise { from { opacity: 0; transform: translateY(18px); } }
@media (max-width: 700px) { .cover-text h1 { max-width: min(9.6ch, 62vw); font-size: clamp(2.1rem, 10.6vw, 2.9rem); } .cover-text p { max-width: min(24ch, 62vw); } }
@media (max-height: 519px) { .cover-text h1 { font-size: clamp(1.7rem, 4vh + 1rem, 2.6rem); max-width: 16ch; } .cover-text { padding-bottom: 14px; gap: 10px; } }

/* part two: the samples. The cloth itself is in the picture; the panel names it and carries its colours */
.cap-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stage-nav { display: flex; align-items: center; gap: 4px; }
.arrow { width: 44px; height: 44px; border-radius: 50%; border: var(--bw) solid var(--field-line); background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; transition: background-color .25s ease, color .25s ease, border-color .25s ease; }
.arrow:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.arrow svg { width: 18px; height: 18px; }
.stage-count { font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 4.2ch; text-align: center; white-space: nowrap; }
.stage-count small { font-size: .62em; }
/* every sample's text lies in the same cell and only the chosen one shows: the panel is as tall as the tallest, so the picture keeps its place from sample to sample */
.stage-info { display: grid; min-width: 0; }
.car-pane { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.car-pane:not(.is-cur) { visibility: hidden; }
.car-pane > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.car-h { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.3rem, 1.1rem + .6vw, 1.6rem); line-height: 1.05; color: var(--ink); }
.car-pane .ok-text { color: var(--good); font-size: .88rem; }
.car-pane .warn-text { color: var(--warn); font-size: .88rem; }
.spec-line { font-size: .84rem; }
.car-pane .btn-row { gap: 6px 14px; align-items: center; }
.cloth-art, .rail-art { display: none; }
.film.no-gl .cloth-art, .film.no-gl .rail-art { display: block; height: 150px; border-radius: 14px; overflow: hidden; background: var(--art); }

/* part three: the rail */
.rail-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.rail-tab { display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; border: 1px solid var(--field-line); border-radius: 12px; padding: 9px 12px; cursor: pointer; color: var(--ink); font: 600 .88rem/1.2 var(--font-body); transition: background-color .2s ease, color .2s ease; }
.rail-tab small { font: 400 .76rem/1.2 var(--font-body); color: var(--ink-2); }
.rail-tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rail-tab[aria-pressed="true"] small { color: inherit; opacity: .78; }
.rail-show { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.rail-show h3 { font: 400 1.35rem/1.1 var(--font-display); }
.rail-show .specs { font-size: .9rem; align-self: stretch; }
.rail-show .specs dt { color: var(--ink-2); }

/* part four: how an order goes, along a measuring tape that runs out as the page moves; the step it has reached is the one that shows */
.tape { position: relative; height: 30px; }
.tape-strip { position: absolute; left: 0; top: 0; bottom: 0; width: calc(8% + 92% * var(--q, 1)); overflow: hidden; border-radius: 0 3px 3px 0; background-color: var(--tape); background-image: repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 10px), repeating-linear-gradient(90deg, var(--tape-ink) 0 2px, transparent 2px 100px); background-size: 100% 9px, 100% 16px; background-repeat: no-repeat; background-position: 0 100%, 0 100%; }
.tape-strip::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 7px; background: var(--metal); }
.tape-strip span { position: absolute; top: 3px; font: 600 .66rem/1 var(--font-body); color: var(--tape-ink); padding-left: 5px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; }
.steps li { grid-area: 1 / 1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-content: start; opacity: 0; transition: opacity .35s ease; }
.steps li::before { content: '0' attr(data-n); grid-row: 1 / span 2; font-family: var(--font-display); font-size: 2.8rem; line-height: .9; color: var(--accent-2); }
.steps h3 { font-size: 1.08rem; align-self: end; }
.steps p { grid-column: 2; }
#tape[data-step="1"] .steps li[data-n="1"], #tape[data-step="2"] .steps li[data-n="2"], #tape[data-step="3"] .steps li[data-n="3"], #tape[data-step="4"] .steps li[data-n="4"] { opacity: 1; }
#tape:not([data-step]) .steps, .film.no-gl .steps { display: flex; flex-direction: column; gap: 12px; }
#tape:not([data-step]) .steps li, .film.no-gl .steps li { opacity: 1; }
@media (min-width: 901px) { /* beside the picture there is room for all four; the one the tape has reached stands out */
  .steps { display: flex; flex-direction: column; gap: 14px; }
  .steps li { opacity: .34; }
}

/* part five: a day at the window */
.day-panel .day-clock { font-family: var(--font-display); font-size: clamp(3rem, 2rem + 4.4vw, 5.6rem); line-height: .82; font-variant-numeric: tabular-nums; color: var(--ink); }
.day-line { position: relative; height: 2px; margin: 8px 6px 4px; background: var(--line); border-radius: 2px; }
.day-line::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--t, 0) * 100%); background: var(--accent-2); }
.day-line::after { content: ''; position: absolute; left: calc(var(--t, 0) * 100%); top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent-2); }
.day-panel legend, .day-panel .field-label { margin: 0 0 6px; }
.day-panel #day-cap { color: var(--ink); min-height: 2.9em; }

/* part six: night, the curtains drawn, and the call to book */
.cap-close { align-items: center; justify-content: center; }
.closing-in { width: min(660px, 86%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px; color: #EFE7D6; text-shadow: 0 2px 22px rgba(0, 0, 0, .55); }
.closing-in h2 { font-size: clamp(2.2rem, 1.3rem + 3.8vw, 4.6rem); line-height: .98; color: #FBF5E8; }
.closing-in .btn-row { justify-content: center; }
.closing-in .contact dt { color: #C9C2B2; }
.closing-in .contact a { color: #FBF5E8; }
.closing-in p { color: #C9C2B2; font-size: .95rem; }
.film.no-gl .closing-in { background: rgba(8, 28, 30, .78); padding: 26px 22px; border-radius: 22px; } /* over the drawn window the words need a ground of their own */

@media (max-width: 560px) {
  .cap-panel { gap: 8px; }
  .car-pane > div:first-child p:not(.spec-line), .cap-lead, .rail-show > p, .day-note { display: none; }
}

/* drawn cloth and the pieces the film shares with the other pages; the drawn window is what a page without a graphics card shows behind the film */
.cover-art { position: absolute; inset: 0; }
.cover-win { position: absolute; inset: 0 13%; background: linear-gradient(90deg, transparent calc(33.3% - 3px), rgba(255, 255, 255, .7) calc(33.3% - 3px), rgba(255, 255, 255, .7) calc(33.3% + 3px), transparent calc(33.3% + 3px), transparent calc(66.6% - 3px), rgba(255, 255, 255, .7) calc(66.6% - 3px), rgba(255, 255, 255, .7) calc(66.6% + 3px), transparent calc(66.6% + 3px)), radial-gradient(58% 44% at 60% 30%, rgba(255, 250, 230, .95), transparent 72%); }
:root[data-mode="dark"] .cover-win { background: linear-gradient(90deg, transparent calc(33.3% - 3px), rgba(255, 255, 255, .28) calc(33.3% - 3px), rgba(255, 255, 255, .28) calc(33.3% + 3px), transparent calc(33.3% + 3px), transparent calc(66.6% - 3px), rgba(255, 255, 255, .28) calc(66.6% - 3px), rgba(255, 255, 255, .28) calc(66.6% + 3px), transparent calc(66.6% + 3px)), radial-gradient(60% 40% at 56% 74%, rgba(255, 200, 140, .7), transparent 72%); }
.cover-sheer { position: absolute; left: 7%; right: 7%; top: 0; bottom: 8%; opacity: .93; transform-origin: 50% 0; animation: coverSway 11s ease-in-out infinite alternate; }
:root[data-mode="dark"] .cover-sheer { filter: brightness(.78); }
@keyframes coverSway { from { transform: skewX(-.7deg); } to { transform: skewX(.9deg); } }
.cover-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 12%; background: radial-gradient(60% 120% at 50% 0, rgba(255, 246, 220, .5), transparent 70%), linear-gradient(180deg, rgba(0, 0, 0, .22), transparent 45%), var(--cfloor); }
.cover-drape { position: absolute; top: 0; bottom: 5%; width: calc(31% - 21% * var(--q, 0)); }
.cover-drape::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34px; background: linear-gradient(90deg, rgba(0, 0, 0, .34), transparent); }
.cover-drape.l { left: 0; }
.cover-drape.l::after { left: 100%; }
.cover-drape.r { right: 0; }
.cover-drape.r::after { right: 100%; transform: scaleX(-1); }
.cover-pelmet { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--top-h, 64px) + 30px); box-shadow: 0 8px 16px rgba(0, 0, 0, .38); }
.cover-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 22, 24, .3), transparent 140px, transparent 48%, rgba(6, 22, 24, .68)), linear-gradient(90deg, rgba(6, 22, 24, .36), transparent 58%); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; display: inline-flex; cursor: pointer; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sw i { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 1px solid var(--field-line); box-shadow: inset 0 0 0 3px var(--surface); display: block; transition: scale .2s cubic-bezier(.2, .7, .2, 1); }
.sw:hover i { scale: 1.1; }
.sw.on-bg i { box-shadow: inset 0 0 0 3px var(--amb, var(--bg)); }
.sw input:checked + i { outline: 2px solid var(--ink); outline-offset: 2px; }
.sw input:focus-visible + i { outline: 2px solid var(--link); outline-offset: 4px; }
.sw-name { font-size: .88rem; }
.sw-name b { font-weight: 600; }
canvas.cloth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; }
.fab.dressed { background: none; }
.band { display: flex; flex-direction: column; gap: 16px; }
.lead { font-size: 1.14rem; color: var(--ink-2); max-width: 58ch; }
.night { background: var(--grain, none), var(--chrome); background-color: var(--chrome); color: var(--chrome-ink); }
.night h2, .night h3 { color: var(--chrome-ink); }
.night p { color: var(--chrome-2); }
.night :focus-visible { outline-color: var(--chrome-ink); }
.art-view { position: relative; align-self: stretch; height: 100%; overflow: hidden; }
.art-cloth { position: absolute; left: 9%; right: 9%; top: 26px; height: 560px; transition: scale .7s cubic-bezier(.2, .7, .2, 1); transform-origin: 50% 0; }
.art-view.k-track::before { content: ''; position: absolute; left: 0; right: 0; top: 20px; height: 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .3)), #A9ABA3; z-index: 2; }
.art-view.is-motor::after { content: ''; position: absolute; left: 3%; top: 13px; width: 15%; height: 28px; border-radius: 5px; background: linear-gradient(180deg, #C4C6BE, #8F9189); z-index: 3; box-shadow: inset -14px 0 0 -11px #3DBE7B; }
.strip-band { padding-top: clamp(72px, 10vw, 150px); gap: 10px; }
.strip { display: flex; align-items: flex-start; gap: 16px; overflow-x: auto; padding: 22px max(clamp(16px, 4vw, 32px), calc((100% - 1180px) / 2 + 32px)) clamp(56px, 8vw, 110px); scroll-snap-type: x proximity; scrollbar-width: thin; }
.strip:focus-visible { outline: 2px solid var(--link); outline-offset: -4px; }
.tile { flex: none; width: clamp(200px, 25vw, 320px); aspect-ratio: 3 / 4; border-radius: 14px; scroll-snap-align: start; position: relative; overflow: hidden; display: flex; align-items: flex-end; translate: calc((1 - var(--q, 1)) * 110px) 0; background-color: var(--art); }
.tile:nth-child(even) { margin-top: 40px; }
.tile span { position: relative; z-index: 1; margin: 10px; padding: 5px 11px; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: .8rem; font-weight: 600; }
.contact dl { display: grid; grid-template-columns: auto auto; gap: 6px 16px; justify-content: center; text-align: left; font-size: .95rem; }
.contact dt { color: var(--chrome-2); }
.contact dd { margin: 0; overflow-wrap: anywhere; }
.contact a { color: var(--chrome-ink); }

/* fabric drawing */
.fab { background: linear-gradient(90deg, rgba(0, 0, 0, .22), rgba(255, 255, 255, .2) 50%, rgba(0, 0, 0, .22)) 0 0 / calc(100% / var(--n, 8)) 100% repeat-x, var(--fab, #ccc); }
.fab.sheer { background: linear-gradient(90deg, rgba(70, 80, 90, .12), rgba(255, 255, 255, .6) 50%, rgba(70, 80, 90, .12)) 0 0 / calc(100% / var(--n, 8)) 100% repeat-x, var(--fab, #eee); }
.card-drape { height: 220px; overflow: hidden; background: var(--grain, none), var(--art); background-color: var(--art); }
.card:hover .art-cloth { scale: 1.04; }
.incl { list-style: none; padding: 0; display: flex; flex-direction: column; font-size: .92rem; }
.incl li { padding: 6px 0; border-bottom: 1px solid var(--line); }

/* cards and grids */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: var(--bw) solid var(--field-line); background: var(--surface); border-radius: var(--r-btn); padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: .9rem; }
.tag[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag.small { padding: 4px 10px; font-size: .78rem; white-space: nowrap; }
.tag.small b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card-body .btn { margin-top: auto; align-self: flex-start; }
.card-body .specs { margin-block: 4px 10px; }
.card-title { font-size: 1.55rem; line-height: 1.1; }
.eyebrow { font-size: .85rem; color: var(--ink-2); }
.specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: .9rem; }
.specs dt { color: var(--ink-2); }
.specs dd { margin: 0; overflow-wrap: anywhere; }

/* tables */
.scroll-x { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .9rem; background: var(--surface); }
table.data th, table.data td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.data thead th { font-size: .82rem; color: var(--ink-2); border-bottom: var(--bw) solid var(--ink); }
table.data .num { text-align: right; }
table.data td.yes { color: var(--good); font-weight: 700; }
table.data td.no { color: var(--ink-2); }
table.cal { min-width: 860px; }
table.sticky-col thead th:first-child, table.sticky-col tbody th[scope="row"] { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
table.cal td.free { color: var(--ink-2); font-size: .82rem; }
table.cal td.busy { background: var(--warn-bg); color: var(--warn); }
table.cal td.done { background: var(--surface-2); color: var(--ink-2); }
.scroll-x:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* panels and forms */
.panel { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.panel > h2 { font-size: 1.6rem; }
.form { gap: 18px; }
.form.book, .form.track { max-width: 640px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend, .field-label { font-weight: 700; padding: 0; font-size: .95rem; margin-bottom: 8px; }
.field-label { margin: 4px 0 0; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: .9rem; min-width: 0; }
.field > span { font-weight: 600; color: var(--ink-2); }
.field small { color: var(--ink-2); }
input[type="text"], input[type="tel"], select, textarea { background: var(--bg); border: var(--bw) solid var(--field-line); border-radius: calc(var(--r) * .6); padding: 10px 12px; width: 100%; min-width: 0; font-size: 1rem; }
::placeholder { color: var(--ink-2); opacity: 1; }
input[aria-invalid="true"] { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.field-err { color: var(--bad); font-size: .85rem; font-weight: 600; }
.field-err:empty, .flash:empty { display: none; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair.three, .pair.four { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.col { flex-direction: column; }
.chip { position: relative; display: inline-flex; cursor: pointer; min-width: 0; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip-body { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 14px; border: var(--bw) solid var(--field-line); border-radius: 12px; background: var(--surface); font-size: .9rem; line-height: 1.25; }
.chips.col .chip { display: flex; }
.chips.col .chip-body { width: 100%; border-radius: calc(var(--r) * .6); justify-content: space-between; }
.chip-body small { color: var(--ink-2); font-size: .8rem; font-variant-numeric: tabular-nums; }

  function settle(changedField) {

  }

    var c = S.cfg;

    }).join('') + '</div></fieldset>';
  }
  function cfgDynamic() {
    var c = S.cfg, h = '', ownRail = c.rail === 'own';
    h += '<fieldset><legend>' + t('cfg.mode') + '</legend><div class="chips">' + Pricing.modeOptions(c).map(function (m) {
        return radio('mode', m.mode, c.mode === m.mode, t('cfg.mode.' + m.mode, { n: PARAMS.overhang }), { extra: m.ok ? '' : t('issue.wallToWall'), off: !m.ok });
      }).join('') + '</div>' + (ownRail ? '<p class="muted small">' + t('cfg.ownWidth') + '</p>' : '') + '</fieldset>';
    h += '<fieldset><legend>' + t('cfg.shape') + '</legend><div class="chips">' + SHAPES.map(function (k) { return radio('shape', k, c.shape === k, t('shape.' + k)); }).join('') + '</div></fieldset>';
    h += '<fieldset><legend>' + t('cfg.layers') + '</legend><div class="chips">' + LAYERS.map(function (k) { return radio('layers', k, c.layers === k, t('layers.' + k)); }).join('') + '</div></fieldset>';
    function fabField(role, types, cur) { // the fabric first, then its colours
      var fams = FAMILIES.filter(function (fam) { return types.indexOf(familyOf(fam)[0].type) >= 0; });
      var f = fabricById(cur); if (!f || fams.indexOf(f.fam) < 0) f = familyOf(fams[0])[0];
      return '<fieldset><legend>' + t('cfg.' + role) + '</legend><div class="chips">' + fams.map(function (fam) {

      }).join('') + '</div><p class="sw-name" id="' + role + '-col-label">' + t('car.color') + ': <b>' + esc(colorName(f)) + '</b></p><div class="swatches" role="radiogroup" aria-labelledby="' + role + '-col-label">' +
        familyOf(f.fam).map(function (x) { return swatch(role + 'Id', x, x.id === f.id, role + 'Id'); }).join('') + '</div>' + stockHtml(f, role + '-stock') + '</fieldset>';
    }
    if (c.layers === 'sheer' || c.layers === 'double') h += fabField('sheer', ['sheer'], c.sheerId);
    if (c.layers === 'main' || c.layers === 'double') h += fabField('main', ['blackout', 'decor'], c.mainId);
    if (c.layers !== 'none') h += '<fieldset><legend>' + t('cfg.panels') + '</legend><div class="chips">' + radio('panels', '2', c.panels === 2, t('panels.2')) + radio('panels', '1', c.panels === 1, t('panels.1')) + '</div></fieldset>';
    h += '<fieldset><legend>' + t(c.layers === 'none' ? 'cfg.heading.own' : 'cfg.heading') + '</legend><div class="chips">' + HEADINGS.map(function (k) { return radio('heading', k, c.heading === k, t('heading.' + k)); }).join('') + '</div></fieldset>';
    h += '<fieldset><legend>' + t('cfg.rail') + '</legend><div class="chips col">' + Pricing.railOptions(c).map(function (o) {

      else if (o.consult) extra = t('issue.consult');
      return radio('rail', o.rail.id, c.rail === o.rail.id, t('rail.' + o.rail.id), { extra: extra, off: o.issues.length > 0 });
    }).join('') + '</div>' + (S.railNote ? '<p class="note">' + esc(S.railNote) + '</p>' : '') + (!c.rail ? '<p class="alert">' + t('cfg.noRail') + '</p>' : '') + '</fieldset>';
    return h;
  }
  function paintSizeErrors() { // the message sits under the two size fields, and the fields are marked
    var calc = Pricing.computeWindow(S.cfg), msg = { width: '', height: '' };
    calc.errors.forEach(function (e) {
      var f = e.indexOf('width') === 0 ? 'width' : e.indexOf('height') === 0 ? 'height' : '';
      if (!f) return;
      var el = $('cfg-' + f), raw = el ? el.value : '';
      msg[f] = (e === f + 'Invalid' && /[.,]/.test(raw)) ? t('err.sizeMetres') : errText(e);
    });
    ['width', 'height'].forEach(function (f) {
      var el = $('cfg-' + f); if (!el) return;
      if (msg[f]) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid');
    });
    var box = $('cfg-size-err'); if (box) box.textContent = msg.width === msg.height ? msg.width : [msg.width, msg.height].filter(Boolean).join(' ');
    var hint = $('cfg-height-hint'); if (hint) hint.textContent = t('cfg.height.hint.' + (S.cfg.mount === 'wall' ? 'wall' : 'ceiling'));
  }

  function bookErrors() {
    var b = S.book, e = {};
    if (Array.from(Ops.cleanText(b.name, 80).replace(/\s/g, '')).length < 3) e.name = 'name';
    if (!Ops.normalizePhone(b.phone, true)) e.phone = 'phone';
    if (b.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(b.email.trim())) e.email = 'email';
    if (Ops.cleanText(b.address, 120).length < 5) e.address = 'address';
    if (!(S.zone === 'C' || b.callback) && !b.slot) e.slot = 'slot';
    if (!b.consent) e.consent = 'consent';
    return e;
  }
  function clearFixed(k) { // an error message goes away as soon as its field is valid again
    var b = S.book;
    if (!b.errors[k] || bookErrors()[k]) return;
    delete b.errors[k];
    var p = $('book-' + k + '-err'), el = $('book-' + k);
    if (p) p.textContent = '';
    if (el) el.removeAttribute('aria-invalid');
  }
  function submitBooking() {
    var b = S.book;
    b.errors = bookErrors();
    if (Object.keys(b.errors).length) { render(); focusFirstError(); return; }
    var callback = S.zone === 'C' || b.callback;
    var measure = callback ? null : { date: b.slot.split('|')[0], slot: b.slot.split('|')[1] };
    var items = S.est.map(function (x) { return { room: x.room, cfg: x.cfg }; });
    // A filled trap field marks the request for the office; it is still received, without holding a slot.
    var res = Ops.createPublicBooking(st, { name: b.name, phone: b.phone, email: b.email, zone: S.zone, address: b.address, notes: b.notes, consent: b.consent, windows: items, measure: measure, suspect: !!b.hp });
    if (!res.ok) {
      if (['name', 'phone', 'email', 'address', 'consent'].indexOf(res.error) >= 0) b.errors[res.error] = res.error;
      else { b.errors.slot = 'slotTaken'; b.slot = ''; }
      render(); focusFirstError(); return;
    }
    var o = res.order;
    var done = { code: o.code, pin: Ops.last4(o.customer.phone), phone: o.customer.phone, slot: o.measure ? o.measure.slot : null, date: o.measure ? o.measure.date : null, notHeld: !!res.notHeld, items: items, zone: S.zone };
    saveCode(o.code);
    S.est = []; S.added = false; S.wa = null; saveEst();
    S.book = emptyBook(); S.book.done = done;
    S.track = { code: '', pin: '', result: undefined };
    render();
    var d = $('book-done'); if (d) d.focus();
    say(t('book.done') + '. ' + t('book.done.code') + ': ' + done.code);
  }
  function focusFirstError() {
    var order = ['name', 'phone', 'email', 'address', 'slot', 'consent'], b = S.book;
    for (var i = 0; i < order.length; i++) {
      if (!b.errors[order[i]]) continue;
      var el = order[i] === 'slot' ? (document.querySelector('#book-slots input[name=slot]:not([data-off])') || $('book-callback')) : $('book-' + order[i]);
      if (el) el.focus();
      say(t('book.e.' + b.errors[order[i]]));
      return;
    }
  }

  /* ----- tracking ----- */

  function trackResult() {
    var res = S.track.result;
    if (res === undefined) return '';

    var h = '<div class="panel"><h2 id="track-res" tabindex="-1">' + esc(o.code) + '</h2>';

      return '<li class="' + (i < idx ? 'is-past' : i === idx ? 'is-now' : 'is-todo') + '"' + (i === idx ? ' aria-current="step"' : '') + '><span>' + t('c.' + s) + '</span></li>';
    }).join('') + '</ol><dl class="specs">';

        '<dt>' + t('track.deposit') + '</dt><dd>' + t(paidKind('deposit') ? 'track.deposit.yes' : 'track.deposit.no') + '</dd>';

    return h + '</div>';
  }

  /* ----- operations ----- */
  function orderById(id) { for (var i = 0; i < st.orders.length; i++) if (st.orders[i].id === id) return st.orders[i]; return null; }
  function orderFlags(o) {
    var f = [];
    if (o.status === 'cancelled') return '';
    if (Ops.overdue(st, o)) f.push('<span class="pill bad">' + t('ops.flag.overdue') + '</span>');
    if (Ops.pastPromised(st, o)) f.push('<span class="pill bad">' + t('ops.flag.promised') + '</span>');
    if (o.hold) f.push('<span class="pill warn">' + t('ops.flag.hold') + '</span>');
    if (o.windows.some(function (w) { return w.rail.status === 'short'; })) f.push('<span class="pill bad">' + t('ops.flag.short') + '</span>');
    if (Ops.STATES.indexOf(o.status) < 3 && Ops.estimate(o).consultCount) f.push('<span class="pill warn">' + t('ops.flag.consult') + '</span>');
    if (Ops.quoteExpired(st, o)) f.push('<span class="pill bad">' + t('ops.flag.expired') + '</span>');
    if (Ops.quoteExpiring(st, o)) f.push('<span class="pill warn">' + t('ops.flag.expiring') + '</span>');
    if (o.suspect) f.push('<span class="pill warn">' + t('ops.flag.suspect') + '</span>');
    return f.join('');
  }

    if (S.ops.open && v === 'ops') { closeDrawer(true); return; } // Back from an open order
    if (VIEWS.indexOf(v) >= 0 && v !== S.view) go(v, true);
  });
  window.addEventListener('resize', function () {
    var top = $('page-top');
    if (top) root.style.setProperty('--top-h', (getComputedStyle(top).position === 'sticky' ? top.offsetHeight : 0) + 'px');
    var mb = $('menu-btn'); if (S.menu && mb && getComputedStyle(mb).display === 'none') setMenu(false); // the wide layout has no menu to keep open
    topState();
  });
  window.addEventListener('scroll', topState, { passive: true });

  /* ----- boot ----- */
  loadPrefs();
  var start = '';
  try { start = location.hash.replace('#', ''); } catch (e) { start = ''; }
  S.view = VIEWS.indexOf(start) >= 0 ? start : start.indexOf('ops-') === 0 && !PUBLIC_ONLY ? 'ops' : 'home';
  if (S.view === 'ops' && start.indexOf('ops-') === 0 && orderById(start.slice(4))) S.ops.open = start.slice(4);
  if (!start || (S.view === 'home' && start !== 'home')) { try { history.replaceState(null, '', '#' + S.view); } catch (e) { /* the first Back then leaves the page */ } }
  try { if (S.view === 'ops' || sessionStorage.getItem('pn.intro')) root.classList.add('intro-done'); else sessionStorage.setItem('pn.intro', '1'); } catch (e) { /* it simply plays */ }
  render();
  if (S.ops.open) { var oc = $('od-close'); if (oc) oc.focus(); }
  try { // until a form is chosen with the switch, the page follows the phone when its setting changes
    var mq = window.matchMedia('(prefers-color-scheme: dark)'), onSys = function () { if (S.modePicked) return; S.mode = mq.matches || S.design === 'nate' ? 'dark' : 'light'; relook(); };
    if (mq.addEventListener) mq.addEventListener('change', onSys); else if (mq.addListener) mq.addListener(onSys);
  } catch (e) { /* the form chosen at load stays */ }
})();
</script>
