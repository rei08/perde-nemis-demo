<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E5">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<script>window.PN_PUBLIC = true;</script>
<title>Perde Nemis Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Shippori+Mincho:wght@400;500&display=swap">
<style>
/* A calm shop on a near-white cream, after the client's reference (tesorocasa.it): one soft grey-brown for headings,
   lines and buttons; headings in capitals; thin pill buttons; photographs edge to edge. Where a photograph does not
   exist yet, an empty, marked frame holds its place in the proportions it will have.
   There is one look: no dark form and no palette switch. The language only swaps strings. */
:root {
  color-scheme: only light; /* "only": a phone browser's own dark theme must not recolour the page, or the colour samples stop matching the cloth */
  --bg: #FFFDF8; --surface: #FFFFFF; --surface-2: #F3EDE3; --ink: #4E4E4E; --ink-2: #6D675F; --line: #E4DCD0; --field-line: #948A7F;
  --taupe: #8E8479; --rule: #B9AFA5; --accent: #6F655B; --accent-ink: #FFFDF8; --link: #6F655B; --btn-line: #9B9187; --mark: #8E8479;
  --good: #2A6A45; --good-bg: #DFE9D8; --warn: #7A5200; --warn-bg: #F3E4BE; --bad: #A33A28; --bad-bg: #F3DAD1;
  --ph: #EFE8DD; --ph-line: rgba(109, 103, 95, .45); --soft: linear-gradient(180deg, #FFFDF8 19%, #F2ECE1);
  --font-display: 'Shippori Mincho', 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body: 'Karla', 'Segoe UI', system-ui, sans-serif;
  --font-data: 'Karla', 'Segoe UI', system-ui, sans-serif;
  --r: 10px; --r-btn: 999px; --bw: 1px; --shadow: none;
  --gut: clamp(16px, 4vw, 32px);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h, 0px) + 12px); scroll-padding-bottom: 92px; }
:root.drawer-open, :root.drawer-open body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 400; }
h1 { font-size: clamp(2.1rem, 1.5rem + 2.6vw, 3.4rem); }
h2 { font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.5rem); }
h3 { font-size: 1.06rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p, dl, ul, ol { margin: 0; }
a { color: var(--link); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: var(--gut); }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.lead { font-size: 1.12rem; max-width: 56ch; }
.ok-text { color: var(--good); font-size: .92rem; font-weight: 500; }
.warn-text { color: var(--warn); font-size: .92rem; font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
bdi { unicode-bidi: isolate; }
/* the headings of the public pages: capitals in the soft grey-brown */
.caps { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; color: var(--taupe); letter-spacing: .01em; overflow-wrap: break-word; }
.plain-h { font: 400 clamp(1.6rem, 1.3rem + 1.2vw, 2.4rem)/1.2 var(--font-display); color: var(--ink-2); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.eyebrow::before { content: ''; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--taupe); margin-right: 8px; vertical-align: middle; }

/* top bar */
.top { position: relative; z-index: 20; background: var(--bg); box-shadow: 0 1px 14px rgba(110, 96, 82, .13); }
@media (min-height: 600px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); } }
.top-row { display: flex; align-items: center; gap: 8px 22px; min-height: 86px; padding-block: 10px; max-width: 1400px; }
.brand { display: inline-flex; flex-direction: column; align-items: center; flex: none; color: var(--taupe); text-decoration: none; line-height: 1; }
.brand b { font: 400 1.9rem/1 var(--font-display); letter-spacing: .05em; }
.brand span { font: 400 .72rem/1 var(--font-body); letter-spacing: .5em; margin: 7px -.5em 0 0; }
.menu { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 16px; }
#nav { display: flex; gap: 4px; min-width: 0; margin-inline: auto; }
.navlink { position: relative; white-space: nowrap; padding: 12px 13px; color: var(--ink); font-size: .86rem; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; text-decoration: none; }
.navlink:hover { color: var(--accent); }
.navlink[aria-current="page"] { color: var(--taupe); }
.navlink[aria-current="page"]::before { content: ''; position: absolute; left: 13px; right: 13px; top: 0; height: 2px; background: var(--taupe); }
#nav-home { display: none; } /* the name in the corner is the way home; the link shows in the full-screen menu */
.btn.top-cta { flex: none; }
.l-short { display: none; }
@media (max-width: 430px) { .l-full { display: none; } .l-short { display: inline; } }
#controls { display: flex; align-items: center; gap: 10px; flex: none; }
.seg { display: inline-flex; border: var(--bw) solid var(--field-line); border-radius: var(--r-btn); overflow: hidden; background: var(--surface); }
.seg-btn { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: .84rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.seg-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.top .seg { border: 0; background: none; gap: 2px; overflow: visible; }
.top .seg-btn { padding: 6px 7px; border-radius: 2px; letter-spacing: .06em; }
.top .seg-btn[aria-pressed="true"] { background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
.noscript { padding-block: 40px; font-size: 1.05rem; }
.menu-btn { display: none; flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--btn-line); background: none; cursor: pointer; place-items: center; color: var(--accent); padding: 0; }
.menu-bars { position: relative; width: 18px; height: 10px; display: block; }
.menu-bars::before, .menu-bars::after { content: ''; position: absolute; left: 0; right: 0; height: 1.5px; background: currentColor; transition: transform .25s ease, top .25s ease; }
.menu-bars::before { top: 0; }
.menu-bars::after { top: 8.5px; }
:root.menu-open .menu-bars::before { top: 4px; transform: rotate(45deg); }
:root.menu-open .menu-bars::after { top: 4px; transform: rotate(-45deg); }
:root.menu-open, :root.menu-open body { overflow: hidden; }

/* the page */
main { display: block; outline: none; }
.view-body { display: flex; flex-direction: column; gap: clamp(32px, 4.4vw, 56px); padding-block: clamp(28px, 4vw, 56px) clamp(64px, 8vw, 104px); }
@keyframes viewIn { from { opacity: 0; } to { opacity: 1; } }
main.is-entering { animation: viewIn .3s ease both; }
.view-head { display: flex; flex-direction: column; gap: 12px; }
.view-head h1 { font-size: clamp(2.2rem, 1.5rem + 3vw, 3.75rem); text-transform: uppercase; color: var(--taupe); letter-spacing: .01em; }
.view-head p { max-width: 60ch; font-size: 1.1rem; }
.crumb { font-size: .86rem; }
.crumb a { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--ink-2); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.crumb svg { width: 13px; height: 13px; }
.kind { color: var(--ink-2); font-size: .95rem; }
.h3 { font: 700 1.06rem/1.25 var(--font-body); letter-spacing: 0; text-transform: none; color: var(--ink); }

/* buttons: thin pills */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 30px; border-radius: var(--r-btn); border: var(--bw) solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 .84rem/1.2 var(--font-body); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; text-decoration: none; text-align: center; }
.btn:hover { background: #62594F; border-color: #62594F; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--btn-line); }
.btn.ghost:hover { background: rgba(142, 132, 121, .1); border-color: var(--accent); }
.btn.on-photo { background: transparent; color: #FFFDF8; border-color: #FFFDF8; }
.btn.on-photo:hover { background: rgba(255, 253, 248, .16); }
.btn.small { padding: 10px 18px; font-size: .78rem; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.btn.ghost.danger { background: transparent; color: var(--bad); }
.btn[disabled] { background: var(--surface-2); color: var(--ink-2); border-color: var(--field-line); border-style: dashed; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .9rem; text-align: left; }

/* a frame that holds the place of a photograph: its proportions are the ones the photograph will have */
.ph { position: relative; margin: 0; aspect-ratio: var(--ar, 2 / 3); background: var(--ph); overflow: hidden; display: grid; place-items: center; min-width: 0; }
.ph::before { content: ''; position: absolute; inset: 10px; border: 1px dashed var(--ph-line); pointer-events: none; }
.ph-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 22px 18px; text-align: center; color: var(--ink-2); font-size: .84rem; line-height: 1.3; max-width: 25ch; }
.ph-in svg { width: 22px; height: 22px; margin-bottom: 4px; }
.ph-in b { font-weight: 700; }
.ph-in small { font-size: .76rem; font-variant-numeric: tabular-nums; }
.ph-chip { position: absolute; left: 20px; bottom: 20px; width: 38px; height: 38px; border-radius: 50%; background: var(--c); border: 1px solid rgba(78, 78, 78, .25); box-shadow: 0 0 0 4px var(--ph); }
.ph.fill { aspect-ratio: auto; height: 100%; min-height: clamp(280px, 44vw, 560px); }

/* colour samples */
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { position: relative; display: inline-flex; cursor: pointer; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sw i { width: 36px; height: 36px; border-radius: 50%; background: var(--c); border: 1px solid rgba(78, 78, 78, .25); display: block; }
.sw input:checked + i { outline: 1.5px solid var(--accent); outline-offset: 3px; }
.sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 4px; }
.sw-name { font-size: .95rem; }
.sw-name b { font-weight: 700; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 1px solid rgba(78, 78, 78, .22); }

/* home: the opening photograph with the heading over it */
.hero { position: relative; display: grid; align-items: end; min-height: clamp(470px, 74vh, 680px); color: #FFFDF8; overflow: hidden; }
.hero-ph { position: absolute; inset: 0; aspect-ratio: auto; background: linear-gradient(100deg, #74695F, #7E7368); } /* deep enough for cream text at 4.5:1 across the whole width, as the scrim over the photograph will be */
.hero-ph::before { border-color: rgba(255, 253, 248, .5); }
.hero-ph .ph-in { position: absolute; left: 26px; top: 22px; align-items: flex-start; text-align: left; color: #FFFDF8; padding: 0; max-width: 30ch; }
.hero-in { position: relative; width: 100%; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 24px clamp(24px, 6vw, 96px); align-items: end; padding-block: 150px clamp(44px, 10vh, 100px); }
.hero h1 { font-size: clamp(2.2rem, 1rem + 5vw, 4.6rem); line-height: 1.22; letter-spacing: .01em; }
.hero h1 span { display: block; }
.hero h1 .l1 { text-transform: uppercase; }
.hero-side { display: flex; flex-direction: column; gap: 22px; align-items: flex-start; padding-bottom: 10px; }
.hero-side p { max-width: 38ch; }
/* sections */
.sec { padding-block: clamp(56px, 8vw, 112px); }
.sec-title { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; margin-bottom: clamp(26px, 4vw, 52px); }
.sec-title h2 { font-size: clamp(2rem, 1.3rem + 3vw, 3.75rem); }
.sec-title p:not(.eyebrow) { max-width: 46ch; }
.center { display: flex; justify-content: center; margin-top: clamp(26px, 4vw, 44px); }
.shop .view-head { margin-bottom: 28px; }
.about { max-width: 52ch; margin-inline: auto; text-align: center; display: flex; flex-direction: column; gap: 16px; }
.bigword { overflow: hidden; white-space: nowrap; display: flex; justify-content: center; font: 400 14.2vw/.78 var(--font-display); letter-spacing: .04em; padding-top: .08em; color: transparent; background: linear-gradient(180deg, #B9AFA5, rgba(255, 253, 248, 0) 88%); -webkit-background-clip: text; background-clip: text; -webkit-user-select: none; user-select: none; }
.sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px; margin-bottom: clamp(22px, 3vw, 40px); }
.sec-head > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec-head p { color: var(--ink-2); max-width: 50ch; font-size: .95rem; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 14px; }
.fcard { display: flex; flex-direction: column; gap: 12px; color: inherit; text-decoration: none; min-width: 0; }
.fcard-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fcard-name { font: 700 1.22rem/1.3 var(--font-body); }
.fcard:hover .fcard-name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.fcard-meta { color: var(--ink-2); font-size: .95rem; }
.fcard .dots { margin-top: 5px; }
.steps { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 36px clamp(20px, 3vw, 44px); counter-reset: s; text-align: center; }
.steps li { counter-increment: s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.steps li::before { content: counter(s); font: 400 3.4rem/1 var(--font-display); color: var(--taupe); margin-bottom: 6px; }
.steps h3 { font: 400 1.45rem/1.25 var(--font-body); }
.steps p { color: var(--ink-2); font-size: .95rem; max-width: 30ch; }
/* a photograph and a soft panel side by side, edge to edge, between two thin lines */
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-block: 1px solid var(--rule); }
.split-text { background: var(--soft); display: flex; flex-direction: column; gap: 20px; align-items: flex-start; justify-content: center; padding: clamp(36px, 6vw, 88px) clamp(20px, 6vw, 88px); }
.split-text { min-width: 0; }
.split-text h2 { font-size: clamp(1.7rem, .6rem + 3.1vw, 3.75rem); line-height: 1.25; overflow-wrap: break-word; max-width: 100%; }
.split-text p { font-size: clamp(1.05rem, 1rem + .4vw, 1.3rem); max-width: 36ch; }
.split-text .btn { margin-top: 10px; }
.split.rev > .ph { order: 2; }
.build-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; counter-reset: b; color: var(--ink-2); font-size: .95rem; }
.build-list li { counter-increment: b; }
.build-list li::before { content: counter(b) '. '; color: var(--taupe); font-weight: 700; }
.igrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px clamp(14px, 2.4vw, 28px); }
.icard { display: flex; flex-direction: column; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.icard-title { font: 700 1.22rem/1.3 var(--font-body); margin-top: 2px; }
.icard:hover .icard-title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.icard p { color: var(--ink-2); font-size: .95rem; }
.glist { list-style: none; padding: 0; border-bottom: 1px solid var(--line); max-width: 860px; margin-inline: auto; }
.glist a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 20px; padding: 20px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.glist b { font: 400 1.55rem/1.25 var(--font-display); color: var(--ink-2); }
.glist span { grid-column: 1; color: var(--ink-2); font-size: .97rem; }
.glist svg { grid-row: 1 / span 2; grid-column: 2; width: 18px; height: 18px; color: var(--taupe); }
.glist a:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.contact { display: grid; grid-template-columns: auto auto; gap: 6px 16px; justify-content: start; text-align: left; font-size: .95rem; }
.contact dt { color: var(--ink-2); }
.contact dd { margin: 0; overflow-wrap: anywhere; }

/* footer */
.foot { border-top: 1px solid var(--line); font-size: .9rem; overflow: hidden; }
.foot-in { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: 32px clamp(20px, 5vw, 72px); padding-block: 56px 26px; max-width: 1000px; }
.foot-in > div { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; }
.foot .foot-say { font: 400 1.45rem/1.25 var(--font-body); max-width: 16ch; }
.foot ul { list-style: none; padding: 0; display: flex; flex-direction: column; }
.foot li a { display: inline-flex; align-items: center; min-height: 34px; color: var(--ink); text-decoration: none; text-transform: uppercase; font-weight: 700; font-size: .8rem; letter-spacing: .05em; }
.foot li a:hover { text-decoration: underline; }
.foot .brand { margin-bottom: 8px; }
.demo-note { font-size: .8rem; color: var(--ink-2); padding-block: 0 8px; max-width: 96ch; }
.foot .bigword { margin-top: 10px; opacity: .6; height: .62em; }

/* fabrics and one fabric */
.shop { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px clamp(28px, 5vw, 72px); align-items: start; }
.shop-side { display: flex; flex-direction: column; gap: 14px; }
.side-h { font: 400 1.45rem/1.2 var(--font-body); color: var(--ink); text-transform: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: var(--bw) solid var(--btn-line); background: transparent; border-radius: var(--r-btn); padding: 8px 16px; cursor: pointer; font-weight: 500; font-size: .93rem; color: var(--ink); }
.tag[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag.small { padding: 4px 11px; font-size: .8rem; white-space: nowrap; background: var(--surface); }
.tag.small b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.fab-page, .insp-page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: 'media head' 'media info'; grid-template-rows: auto 1fr; gap: 18px clamp(24px, 4.4vw, 60px); align-items: start; }
.pg-head { grid-area: head; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-top: 6px; }
.pg-media { grid-area: media; }
.pg-info { grid-area: info; }
.pg-info .pg-second { display: none; align-self: stretch; }
.pg-head h1 { font-size: clamp(2.1rem, 1.5rem + 2.4vw, 3.2rem); text-transform: uppercase; color: var(--taupe); letter-spacing: .01em; }
.fab-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fab-gallery .ph:first-child { grid-column: 1 / -1; }
.fab-info { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; min-width: 0; }
.fab-info > .lead { border-top: 1px solid var(--rule); padding-top: 16px; align-self: stretch; max-width: none; font-size: 1rem; }
.fab-info fieldset, .fab-info .specs { align-self: stretch; }
.fab-info > .btn { align-self: stretch; }
.soft-card { align-self: stretch; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 24px 26px 26px; border-radius: 28px; background: var(--soft); box-shadow: 0 14px 30px -22px rgba(110, 96, 82, .5); }
.soft-card h2 { font: 400 1.45rem/1.25 var(--font-body); color: var(--ink); text-transform: none; }
.soft-card p { font-size: .92rem; }
.soft-card .btn { align-self: stretch; margin-top: 6px; }
.specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; font-size: .95rem; }
.specs dt { color: var(--ink-2); }
.specs dd { margin: 0; overflow-wrap: anywhere; }
.specs.lined { gap: 0 18px; border-top: 1px solid var(--line); }
.specs.lined dt, .specs.lined dd { padding: 10px 0; border-bottom: 1px solid var(--line); }

/* rails, inspiration, guides */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 36px clamp(14px, 2.4vw, 28px); }
.card { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-body { display: flex; flex-direction: column; gap: 8px; flex: 1; align-items: flex-start; }
.card-body .specs { margin-block: 4px 8px; align-self: stretch; }
.card-title { font: 700 1.22rem/1.3 var(--font-body); }
.band { display: flex; flex-direction: column; gap: 16px; }
.insp-photos { display: flex; flex-direction: column; gap: 10px; }
.article { max-width: 68ch; display: flex; flex-direction: column; gap: 26px; }
.article h1 { font-size: clamp(2rem, 1.5rem + 2.4vw, 3.2rem); text-transform: uppercase; color: var(--taupe); letter-spacing: .01em; }
.article-parts { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 24px; counter-reset: a; }
.article-parts li { display: flex; flex-direction: column; gap: 6px; }
.article-parts.ordered li { counter-increment: a; padding-left: 46px; position: relative; }
.article-parts.ordered li::before { content: counter(a); position: absolute; left: 0; top: -6px; font: 400 2.1rem/1 var(--font-display); color: var(--taupe); }
.article-parts h2 { font: 700 1.14rem/1.3 var(--font-body); letter-spacing: 0; }
.article-end { border-top: 1px solid var(--rule); padding-top: 22px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.visit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px clamp(18px, 3vw, 40px); list-style: none; padding: 0; counter-reset: v; }
.visit li { counter-increment: v; display: flex; flex-direction: column; gap: 6px; }
.visit li::before { content: counter(v); font: 400 2.6rem/1 var(--font-display); color: var(--taupe); }
.visit p { color: var(--ink-2); font-size: .96rem; }
.incl { list-style: none; padding: 0; display: flex; flex-direction: column; font-size: .95rem; text-align: left; }
.incl li { padding: 8px 0; border-bottom: 1px solid var(--line); }

/* tables */
.scroll-x { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .9rem; background: var(--surface); }
table.data th, table.data td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.data thead th { font-size: .82rem; color: var(--ink-2); border-bottom: var(--bw) solid var(--ink); }
table.data .num { text-align: right; }
table.data td.yes { color: var(--good); font-weight: 700; }
table.data td.no { color: var(--ink-2); }
table.cal { min-width: 860px; }
table.sticky-col thead th:first-child, table.sticky-col tbody th[scope="row"] { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
table.cal td.free { color: var(--ink-2); font-size: .82rem; }
table.cal td.busy { background: var(--warn-bg); color: var(--warn); }
table.cal td.done { background: var(--surface-2); color: var(--ink-2); }
.scroll-x:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* panels and forms */
.panel { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.panel > h2 { font-size: 1.6rem; }
.form { gap: 18px; }
.form.book, .form.track { max-width: 640px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend, .field-label { font-weight: 700; padding: 0; font-size: .95rem; margin-bottom: 8px; }
.field-label { margin: 4px 0 0; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: .9rem; min-width: 0; }
.field > span { font-weight: 600; color: var(--ink-2); }
.field small { color: var(--ink-2); }
input[type="text"], input[type="tel"], select, textarea { background: var(--bg); border: var(--bw) solid var(--field-line); border-radius: calc(var(--r) * .6); padding: 10px 12px; width: 100%; min-width: 0; font-size: 1rem; }
::placeholder { color: var(--ink-2); opacity: 1; }
input[aria-invalid="true"] { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.field-err { color: var(--bad); font-size: .85rem; font-weight: 600; }
.field-err:empty, .flash:empty { display: none; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair.three, .pair.four { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.col { flex-direction: column; }
.chip { position: relative; display: inline-flex; cursor: pointer; min-width: 0; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip-body { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 14px; border: var(--bw) solid var(--field-line); border-radius: 12px; background: var(--surface); font-size: .9rem; line-height: 1.25; }
.chips.col .chip { display: flex; }
.chips.col .chip-body { width: 100%; border-radius: calc(var(--r) * .6); justify-content: space-between; }
.chip-body small { color: var(--ink-2); font-size: .8rem; font-variant-numeric: tabular-nums; }
.chip input:checked + .chip-body { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip input:checked + .chip-body small { color: inherit; opacity: .85; }
.chip input:focus-visible + .chip-body { outline: 2px solid var(--link); outline-offset: 2px; }
.chip.is-off, .chip.is-off input { cursor: not-allowed; }
.chip.is-off .chip-body { border-style: dashed; background: var(--surface-2); }
.chip.is-off .chip-name { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1px; }
.chip.is-off .chip-body small { color: var(--ink); }
.is-dim { opacity: .55; }
.chip-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.range { display: flex; align-items: center; gap: 12px; font-size: .88rem; color: var(--ink-2); }
.range input { flex: 1; min-width: 0; accent-color: var(--accent); }
.note { background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: calc(var(--r) * .5); font-size: .9rem; }
.alert { background: var(--bad-bg); color: var(--bad); padding: 8px 12px; border-radius: calc(var(--r) * .5); font-size: .9rem; }

.lines { width: 100%; border-collapse: collapse; font-size: .92rem; }
.lines td, .lines th { padding: 6px 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
.lines .num { text-align: right; white-space: nowrap; padding-left: 12px; }
.lines tfoot th, .lines tfoot td { font-weight: 700; }
.lines.totals tfoot td { font-weight: 400; }
.lines.totals tr.grand th, .lines.totals tr.grand td { font-weight: 700; font-size: 1.15rem; border-top: var(--bw) solid var(--ink); }
.bom { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 16px; font-size: .88rem; }
.bom li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--field-line); padding-bottom: 3px; }
.bom b { font-family: var(--font-data); font-weight: 500; }
.est-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.est-list li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.est-list li > div:first-child { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: .9rem; overflow-wrap: anywhere; }
.est-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; white-space: nowrap; }

/* booking and tracking */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.days .chip { flex: none; }
.days .chip-body { flex-direction: column; gap: 0; align-items: flex-start; border-radius: calc(var(--r) * .6); white-space: nowrap; }
.chosen { font-weight: 700; }
.done .code { display: flex; flex-direction: column; gap: 2px; }
.done .code b { font-family: var(--font-data); font-size: 1.7rem; letter-spacing: .04em; }
.timeline { list-style: none; padding: 0; display: flex; flex-direction: column; }
.timeline li { position: relative; padding: 6px 0 6px 28px; color: var(--ink-2); }
.timeline li::before { content: ''; position: absolute; left: 4px; top: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-2); background: var(--surface); }
.timeline li::after { content: ''; position: absolute; left: 10px; top: 26px; bottom: -12px; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.is-past { color: var(--ink); }
.timeline li.is-past::before { background: var(--ink); border-color: var(--ink); }
.timeline li.is-now { color: var(--ink); font-weight: 700; }
.timeline li.is-now::before { background: var(--accent); border-color: var(--ink); }

/* operations */
.tabs { display: flex; gap: 4px; border-bottom: var(--bw) solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 16px; cursor: pointer; font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.ops-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.clock { font-family: var(--font-data); font-size: .9rem; }
.lead-form h2 { font-size: 1.05rem; font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }
.jump { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
#ops-pane { display: flex; flex-direction: column; gap: 16px; }
#ops-pane > h2 { font-size: 1.2rem; margin-top: 8px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: 196px; gap: 10px; padding-bottom: 10px; width: max-content; }
.bcol { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.bcol h2 { font-family: var(--font-body); font-size: .82rem; font-weight: 700; letter-spacing: 0; display: flex; justify-content: space-between; gap: 8px; }
.count { color: var(--ink-2); }
.ocard { display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%; background: var(--surface); border: var(--bw) solid var(--line); border-radius: calc(var(--r) * .6); padding: 10px; cursor: pointer; }
.ocard:hover { border-color: var(--ink); }
.ocode { font-family: var(--font-data); font-size: .76rem; color: var(--ink-2); }
.oname { font-weight: 700; overflow-wrap: anywhere; }
.ometa { font-size: .8rem; color: var(--ink-2); overflow-wrap: anywhere; }
.ototal { font-size: .9rem; font-variant-numeric: tabular-nums; }
.oflags { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: var(--r-btn); font-size: .74rem; font-weight: 700; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.accent { background: var(--ink); color: var(--bg); }
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 14, .55); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--bg); z-index: 41; display: flex; flex-direction: column; border-left: var(--bw) solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px; border-bottom: var(--bw) solid var(--line); }
.drawer-head h2 { font-size: 1.25rem; margin-bottom: 8px; overflow-wrap: anywhere; }
.drawer-head > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.drawer-head > div h2 { width: 100%; }
.drawer-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 22px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.drawer-foot { border-top: var(--bw) solid var(--ink); background: var(--surface); padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; }
.foot-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
.flash { color: var(--good); font-size: .88rem; font-weight: 700; outline: none; }
.drawer-body section { display: flex; flex-direction: column; gap: 10px; }
.drawer-body h3 { font-size: .9rem; color: var(--ink-2); }
.drawer-body .next { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 14px; outline-offset: 2px; }
.drawer-body .next .btn { align-self: flex-start; }
.drawer-body h4 { font-size: .9rem; }
.sheet { padding-left: 18px; color: var(--ink-2); }
.reqs { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .92rem; }
.reqs .ok { color: var(--good); }
.reqs em { color: var(--bad); font-style: normal; font-size: .82rem; font-weight: 600; }
.wcard { background: var(--surface); border: var(--bw) solid var(--line); border-radius: calc(var(--r) * .6); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.wcard h4 { overflow-wrap: anywhere; }
.wcard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wcard-head .link { flex: none; }
.editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.editor .wide { grid-column: 1 / -1; }
.railline { display: flex; flex-direction: column; gap: 4px; border-top: 1px dashed var(--field-line); padding-top: 8px; }
.railline ul { padding-left: 18px; }
.railline .pill { align-self: flex-start; }
.log { list-style: none; padding: 0; font-size: .86rem; display: flex; flex-direction: column; gap: 4px; }
.log li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.log li > span { color: var(--ink-2); }
ul.plain { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }

/* forms on the cream: lighter fields, pill choices */
.panel { background: var(--surface); border-color: var(--line); border-radius: 18px; padding: 22px; }
.chip-body { border-radius: 999px; border-color: var(--btn-line); padding: 9px 18px; }
.chips.col .chip-body { border-radius: 16px; }
.days .chip-body { border-radius: 14px; }
.chip input:checked + .chip-body { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip input:focus-visible + .chip-body { outline-color: var(--accent); }
input[type="text"], input[type="tel"], select, textarea { background: var(--bg); border-radius: 10px; }
.timeline li.is-past::before { background: var(--accent); border-color: var(--accent); }
.timeline li.is-now::before { background: var(--taupe); border-color: var(--accent); }
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.tab[aria-pressed="true"] { border-bottom-color: var(--accent); }
table.data thead th { border-bottom-color: var(--rule); }
.drawer-foot { border-top-color: var(--rule); }

/* the builder: one question to a screen, on a soft panel between two thin lines */
.wiz-band { background: var(--soft); border-bottom: 1px solid var(--rule); }
.wiz { display: flex; flex-direction: column; min-height: min(72vh, 700px); padding-block: 26px 0; }
.wiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; }
.wiz-count { font: 400 2.5rem/1 var(--font-display); color: var(--taupe); font-variant-numeric: lining-nums; flex: none; }
.stepper { list-style: none; padding: 0; display: flex; gap: 2px; min-width: 0; }
.stepbtn { display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 6px 9px; background: none; border: 0; cursor: pointer; color: var(--ink-2); font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 500; white-space: nowrap; }
.stepbtn i { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--btn-line); display: grid; place-items: center; font-style: normal; font-size: .78rem; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.stepbtn.is-done i { background: #E7DFD4; border-color: #E7DFD4; color: var(--ink); }
.stepbtn[aria-current="step"] { color: var(--ink); font-weight: 700; }
.stepbtn[aria-current="step"] i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#cfg-form { flex: 1; display: flex; flex-direction: column; gap: 28px; width: 100%; max-width: 900px; margin-inline: auto; padding-top: clamp(22px, 5vh, 56px); text-align: center; }
.step-head { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.step-head h2 { font-size: clamp(1.6rem, 1.15rem + 2vw, 2.5rem); color: var(--taupe); outline: none; }
.step-head p { font-size: .92rem; max-width: 48ch; }
#cfg-dyn, #cfg-static { display: flex; flex-direction: column; gap: 26px; align-items: center; }
#cfg-static:empty { display: none; }
#cfg-form fieldset { align-items: center; gap: 12px; width: 100%; }
#cfg-form legend { margin-inline: auto; text-align: center; font: 400 1.25rem/1.3 var(--font-body); margin-bottom: 12px; }
#cfg-form .chips, #cfg-form .swatches { justify-content: center; }
#cfg-form .chips.col { align-items: stretch; width: 100%; max-width: 520px; }
#cfg-form .chips.col .chip-body { text-align: left; }
#cfg-form .note, #cfg-form .alert { max-width: 560px; }
.hcards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: 100%; }
.hcard { position: relative; display: flex; cursor: pointer; min-width: 0; }
.hcard input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.hcard-body { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 14px 20px; border: var(--bw) solid var(--btn-line); border-radius: 18px; text-align: center; }
.hcard-body svg { width: 92px; height: 60px; color: var(--taupe); margin-bottom: 8px; }
.hcard-body b { font-size: .84rem; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.hcard-body small { color: var(--ink-2); font-size: .86rem; line-height: 1.4; }
.hcard input:checked + .hcard-body { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: rgba(255, 253, 248, .7); }
.hcard input:checked + .hcard-body svg { color: var(--accent); }
.hcard input:focus-visible + .hcard-body { outline: 2px solid var(--accent); outline-offset: 2px; }
/* the two sizes are written on a line, as on a tailor's form */
.sizes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; width: 100%; max-width: 560px; }
.sizes .field, #cfg-form .field.line { align-items: center; gap: 4px; }
.sizes .field > span, #cfg-form .field.line > span { font: 400 1.2rem/1.3 var(--font-body); color: var(--ink); }
.sizes input, #cfg-form .field.line input { background: transparent; border: 0; border-bottom: 1px solid var(--field-line); border-radius: 0; text-align: center; font-size: 1.2rem; padding: 8px 4px; }
#cfg-form .field.line { width: 100%; max-width: 560px; }
.cfg-bar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding: 18px 0 calc(18px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); background: #F2ECE1; box-shadow: 0 0 0 100vmax #F2ECE1; clip-path: inset(-1px -100vmax 0); }
.cfg-bar .btn { white-space: nowrap; min-width: 150px; }
.cfg-bar .btn svg { width: 16px; height: 16px; }
.review { display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 620px; text-align: left; }
.review .sub { display: flex; flex-direction: column; gap: 10px; }
.review h3 { font: 400 1.25rem/1.3 var(--font-body); }
.wiz-sum { padding-block: 34px 72px; display: flex; flex-direction: column; gap: 14px; }
.wiz-sum h2 { font: 400 1.45rem/1.2 var(--font-body); color: var(--ink); }
.sum { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; border-top: 1px solid var(--line); }
.sum li { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: .95rem; min-width: 0; }
.sum small { color: var(--ink-2); font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; }
.sum span { overflow-wrap: anywhere; }

@media (min-width: 700px) { .fgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 20px; } }
@media (min-width: 1000px) { .fgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 46px 22px; } .shop .fgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 901px) {
  /* beside the list, the kinds of fabric are a plain column of links */
  .shop-side .filters { flex-direction: column; align-items: flex-start; gap: 0; }
  .shop-side .tag { border: 0; border-radius: 0; padding: 7px 0; background: none; color: var(--ink-2); font-size: 1rem; }
  .shop-side .tag[aria-pressed="true"] { background: none; color: var(--ink); font-weight: 700; }
}
@media (max-width: 1180px) {
  /* the menu becomes a full screen of large links; the bar keeps the name, the booking button and the menu button */
  .menu-btn { display: grid; }
  .btn.top-cta { margin-left: auto; }
  .menu { position: fixed; inset: 0; z-index: -1; background: var(--bg); padding: 104px var(--gut) 28px; flex-direction: column; align-items: stretch; justify-content: space-between; gap: 28px; overflow-y: auto; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .25s ease, visibility 0s linear .25s; }
  :root.menu-open .menu { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .25s ease; }
  #nav { flex-direction: column; gap: 0; margin-inline: 0; }
  #nav-home { display: block; }

  function lc1(v) { return v.charAt(0).toLowerCase() + v.slice(1); } // "Shufër dekorative Ø28" keeps its diameter sign
  var CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v10.5H4z"/><circle cx="12" cy="13" r="3.4"/></svg>';
  var CHEV = '<svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3l6 6-6 6"/></svg>';
  var BACK = '<svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L5 9l6 6"/></svg>';
  // An empty, marked frame where a photograph will stand. ratio is the photograph's proportion ("2 / 3"); label says
  // which picture belongs there. opt: {cls, id, hex, note}: hex shows the chosen colour as a round sample in the corner;

  function photo(ratio, label, opt) {

  }
  // the top of a curtain in each heading, as a small line drawing: a diagram of the pleat, not a picture of the cloth
  function headIcon(k) {
    var d = '';

    else if (k === 'pinch') d = '<path d="M4 9h60"/><path d="M12 12l-3 8M12 12v8M12 12l3 8M34 12l-3 8M34 12v8M34 12l3 8M56 12l-3 8M56 12v8M56 12l3 8"/><path d="M9 22l-3 16M15 22l8 16M31 22l-8 16M37 22l8 16M53 22l-8 16M59 22l3 16" opacity=".5"/>';
    else if (k === 'pencil') d = '<path d="M4 9h60"/><path d="M6 13h56M6 19h56" opacity=".5"/><path d="M8 13v25M13 13v25M18 13v25M23 13v25M28 13v25M33 13v25M38 13v25M43 13v25M48 13v25M53 13v25M58 13v25"/>';
    else d = '<path d="M2 12h64" stroke-width="3"/><circle cx="14" cy="12" r="5"/><circle cx="34" cy="12" r="5"/><circle cx="54" cy="12" r="5"/><path d="M6 20c4 6 4 12 0 18M24 18c-4 7-4 13 0 20M24 18c4 7 4 13 0 20M44 18c-4 7-4 13 0 20M44 18c4 7 4 13 0 20M62 20c-4 6-4 12 0 18" opacity=".5"/>';

  /* ----- labels ----- */
  function lineLabel(line, cfg) { // what a window takes, named without amounts
    if (line.key === 'fabric') {
      var s = t('line.fabric', { name: esc(fabName(fabricById(line.fabricId))), m: fmtM(line.metresDm) });
      if (line.drops) s += ' (' + tn('line.drops', line.drops) + ')';
      return s;
    }
    if (line.key === 'sewing') return t('line.sewing', { h: t('heading.' + cfg.heading).toLowerCase(), m: fmtM(line.flatDm) });
    if (line.key === 'rail') return t('line.rail', { name: t('rail.' + line.railId) + (Pricing.channelCount(cfg) === 2 ? ', ' + t('rails.double').toLowerCase() : ''), m: fmtM(line.billedDm) });
    if (line.key === 'motorKit') return t('line.motorKit');
    if (line.key === 'install') return t('line.install');
    return esc(line.key);
  }
  function cfgSummary(cfg) { // plain text; escape at the call site
    var bits = [fmtN(cfg.width) + ' × ' + fmtN(cfg.height) + ' cm'];
    if (cfg.rail !== 'own' && cfg.mode === 'wall') bits.push(t('cfg.mode.wall'));
    if (Pricing.shapeOf(cfg) !== 'straight') bits.push(t('shape.' + Pricing.shapeOf(cfg)));
    bits.push(t('layers.' + cfg.layers));
    Pricing.layerRoles(cfg).forEach(function (r) { var f = fabricById(r === 'sheer' ? cfg.sheerId : cfg.mainId); if (f) bits.push(fabName(f)); });
    bits.push(t('heading.' + cfg.heading));
    if (cfg.rail) bits.push(t('rail.' + cfg.rail) + ', ' + t('mount.' + cfg.mount).toLowerCase());
    return bits.join(' · ');
  }
  var STOCKED = RAILS.filter(function (r) { return r.kind !== 'own'; });

  /* ===================== VIEWS ===================== */

  function fabCard(fam) { // a fabric in a list: its photograph, its name, how many colours

      '<span class="fcard-body"><span class="fcard-name">' + esc(f[S.lang]) + '</span><span class="fcard-meta">' + t('type.' + f.type) + ', ' + tn('cat.colors', list.length) + '</span>' + dots(list) + '</span></a>';

  function secTitle(eye, title, text) { // a centred heading in capitals under a small label, as the sections of the home page open

  /* ----- the builder: one window in five steps (fabric, heading, rail, size, summary), no prices ----- */
  // Keeps the window valid after a change and says what changed. A mount or rail the customer picks becomes
  // the preference, so an automatic change of mount is undone as soon as the choice is possible again.
  function settle(changedField) {
    var c = S.cfg;
    if (changedField === 'mount' || changedField === 'rail') S.wantMount = c.mount;
    S.railNote = changedField === 'rail' ? '' : changeNote(Ops.fixRail(c, S.wantMount));
  }
  function cfgMount() {
    var c = S.cfg;
    return '<fieldset><legend>' + t('cfg.mount') + '</legend><div class="chips">' + Pricing.mountOptions(c).map(function (m) {
      return radio('mount', m.mount, c.mount === m.mount, t('mount.' + m.mount), { extra: m.ok ? '' : t('mount.off'), off: !m.ok });
    }).join('') + '</div></fieldset>';
  }
  function fabField(role, types, cur) { // the fabric first, then its colours
    var fams = FAMILIES.filter(function (fam) { return types.indexOf(familyOf(fam)[0].type) >= 0; });
    var f = fabricById(cur); if (!f || fams.indexOf(f.fam) < 0) f = familyOf(fams[0])[0];
    return '<fieldset><legend>' + t('cfg.' + role) + '</legend><div class="chips">' + fams.map(function (fam) {
      return radio(role + 'Fam', fam, f.fam === fam, esc(familyOf(fam)[0][S.lang]));
    }).join('') + '</div><p class="sw-name" id="' + role + '-col-label">' + t('car.color') + ': <b>' + esc(colorName(f)) + '</b></p><div class="swatches" role="radiogroup" aria-labelledby="' + role + '-col-label">' +
      familyOf(f.fam).map(function (x) { return swatch(role + 'Id', x, x.id === f.id, role + 'Id'); }).join('') + '</div>' + stockHtml(f, role + '-stock') + '</fieldset>';
  }
  function notes() { // what an automatic correction changed, and a choice no rail can carry
    return (S.railNote ? '<p class="note" id="cfg-note">' + esc(S.railNote) + '</p>' : '') + (!S.cfg.rail ? '<p class="alert" id="cfg-norail">' + t('cfg.noRail') + '</p>' : '');
  }
  function stepStatic() { // the two size fields are written once, so typing in them is never interrupted

      case 'ops-tab': S.ops.tab = el.getAttribute('data-tab'); render(); var tb = $('tab-' + S.ops.tab); if (tb) tb.focus(); break;
      case 'ops-next-day': Ops.nextDay(st); refreshOps(S.ops.open ? ['od-next-day', 'od-advance'] : 'ops-next-day', ''); break;
      case 'ops-jump': var col = $('bcol-' + el.getAttribute('data-s')), sc = $('board-scroll'); if (col && sc) sc.scrollLeft = col.offsetLeft - sc.offsetLeft; break;
      case 'lead-open': S.ops.leadOpen = true; refreshOps('lead-name'); break;
      case 'ops-open': openDrawer(el.getAttribute('data-id'), el.id); break;

      case 'ops-confirm-no':

      case 'ops-advance':
        if (!o) break;
        r = Ops.advance(st, o); S.ops.err = {}; S.ops.drafts = {}; S.ops.notes = {}; S.ops.confirm = null;
        refreshOps('od-advance', r.ok ? t('flash.state', { v: t('s.' + o.status) }) : ''); break;
      case 'ops-add-window': if (o) { r = Ops.addWindow(st, o); refreshOps(r.ok ? 'od-room-' + (o.windows.length - 1) : 'od-flash', r.ok ? t('flash.window') : t('ops.e.tooMany', { n: Ops.MAX_WINDOWS })); } break;
      case 'ops-contact-edit': if (o) { S.ops.contact = { name: o.customer.name, phone: o.customer.phone, address: o.customer.address, email: o.customer.email, notes: o.customer.notes, err: '' }; refreshOps('od-ct-name'); } break;
      case 'ops-contact-cancel': S.ops.contact = null; refreshOps('od-contact-edit'); break;
      case 'ops-contact-save':
        if (!o || !S.ops.contact) break;

      case 'ops-remove-window': S.ops.confirm = { kind: 'remove', i: i }; refreshOps('od-confirm-no'); break;
      case 'ops-remove-yes': if (o) { r = Ops.removeWindow(st, o, i); S.ops.confirm = null; S.ops.notes = {}; S.ops.err = {}; S.ops.drafts = {}; refreshOps('od-add-window', r.ok ? t('flash.removed') : ''); } break;
      case 'ops-set-manual':
        if (!o || !o.windows[i]) break;
        r = Ops.setManual(st, o, i, money(draft('man' + i, o.windows[i].manual === null ? '' : o.windows[i].manual)));
        S.ops.err['man' + i] = !r.ok; if (r.ok) delete S.ops.drafts['man' + i];
        refreshOps(r.ok ? 'od-manset-' + i : 'od-man-' + i, r.ok ? t('flash.manual', { v: fmtL(o.windows[i].manual) }) : ''); break;
      case 'ops-cut': if (o) { r = Ops.cutRail(st, o, i); refreshOps('od-kit-' + i, r.ok ? t('flash.cut') : ''); } break;
      case 'ops-kit': if (o) { r = Ops.kitRail(st, o, i); refreshOps('od-flash', r.ok ? t('flash.kit') : ''); } break;
      case 'ops-scrap': S.ops.confirm = { kind: 'scrap', i: i }; refreshOps('od-confirm-no'); break;
      case 'ops-scrap-yes': if (o) { r = Ops.scrapRail(st, o, i); S.ops.confirm = null; refreshOps('od-flash', r.ok ? t('flash.scrap') : ''); } break;
      case 'ops-set-measure':
        if (!o) break;
        r = Ops.setMeasure(st, o, draft('mDate', o.measure ? o.measure.date : ''), draft('mSlot', o.measure ? o.measure.slot : ''));
        S.ops.err.measure = r.ok ? null : r.error; if (r.ok) { delete S.ops.drafts.mDate; delete S.ops.drafts.mSlot; }
        refreshOps('od-msave', r.ok ? t('flash.slot') : ''); break;
      case 'ops-set-install':
        if (!o) break;
        r = Ops.setInstall(st, o, draft('iDate', o.install ? o.install.date : ''), draft('iSlot', o.install ? o.install.slot : ''), draft('iTeam', o.install ? o.install.team : ''));
        S.ops.err.install = r.ok ? null : r.error; if (r.ok) { delete S.ops.drafts.iDate; delete S.ops.drafts.iSlot; delete S.ops.drafts.iTeam; }
        refreshOps('od-isave', r.ok ? t('flash.slot') : ''); break;
      case 'ops-set-travel':
        if (!o) break;
        r = Ops.setTravel(st, o, money(draft('travel', o.travelManual === null ? '' : o.travelManual)));
        S.ops.err.travel = !r.ok; if (r.ok) delete S.ops.drafts.travel;
        refreshOps(r.ok ? 'od-travel-set' : 'od-travel', r.ok ? t('flash.amount') : ''); break;
      case 'ops-set-discount':
        if (!o) break;
        v = String(draft('discount', o.discount || '')).trim();
        r = Ops.setDiscount(st, o, v === '' ? 0 : money(v));
        S.ops.err.discount = !r.ok; if (r.ok) delete S.ops.drafts.discount;
        refreshOps(r.ok ? 'od-discount-set' : 'od-discount', r.ok ? t('flash.amount') : ''); break;
      case 'ops-pay':
        if (!o) break;
        var kind = el.getAttribute('data-kind');
        r = Ops.recordPayment(st, o, kind, S.ops.drafts['inv' + kind]);
        S.ops.err[kind] = r.ok ? null : (['invoiceUsed', 'expired', 'notAccepted', 'longLead', 'hold', 'state'].indexOf(r.error) >= 0 ? r.error : 'invoice');
        if (r.ok) delete S.ops.drafts['inv' + kind];
        refreshOps(r.ok ? 'od-flash' : 'od-inv-' + kind, r.ok ? t('flash.' + kind) : ''); break;
      case 'ops-requote': if (o) { r = Ops.requote(st, o); S.ops.err = {}; refreshOps('od-accepted', r.ok ? t('flash.requote') : ''); } break;
      case 'ops-remeasure': if (o) { r = Ops.remeasure(st, o); S.ops.err = {}; S.ops.drafts = {}; refreshOps('od-mdate', r.ok ? t('flash.remeasure') : ''); } break;
      case 'ops-cancel': S.ops.confirm = { kind: 'cancel' }; refreshOps('od-confirm-no'); break;
      case 'ops-cancel-yes': if (o) { r = Ops.cancel(st, o, el.getAttribute('data-outcome')); S.ops.confirm = null; refreshOps('od-close', r.ok ? t('flash.cancelled') : ''); } break;
      case 'stock-bar': Ops.receiveBar(st, el.getAttribute('data-sys')); refreshOps(el.id); break;
      case 'stock-part': Ops.receivePart(st, el.getAttribute('data-id'), 50); refreshOps(el.id); break;
    }
  });

  function onField(el, isChange) {
    var f = el.getAttribute('data-f'), k = el.getAttribute('data-k'), v = el.value, o = S.ops.open ? orderById(S.ops.open) : null, i = Number(el.getAttribute('data-i')), w, r;
    if (el.getAttribute('data-off')) { // reached with the keyboard: the real choice is put back
      if (S.view === 'config') refreshConfig(true); else if (S.view === 'book') setHTML($('book-slots'), slotsHtml());
      return;
    }
    switch (f) {
      case 'fab-color': // the page's photographs and its stock line follow the colour
        var kf = famFabric(k, v); S.fabCol[k] = kf.id;
        setHTML($('fab-gallery'), fabGallery(kf)); setHTML($('fab-second'), fabSecond(kf));
        var kn = $('fab-col-name'); if (kn) kn.textContent = colorName(kf);
        var kt = $('fab-stock'); if (kt) { kt.className = (kf.stock ? 'ok' : 'warn') + '-text'; kt.textContent = stockText(kf); }
        say(kf[S.lang] + ', ' + colorName(kf) + '. ' + stockText(kf)); break;
      case 'sheerFam': case 'mainFam': // a new fabric starts on its first colour
        S.cfg[f === 'sheerFam' ? 'sheerId' : 'mainId'] = familyOf(v)[0].id; S.added = false;
        settle(f); refreshConfig(true); sayFabric(familyOf(v)[0]); break;
      case 'room': S.room = v; break;
      case 'width': case 'height':
        var nv = num(v);
        if (isChange && (nv === S.cfg[f] || (isNaN(nv) && isNaN(S.cfg[f])))) break; // already applied while typing
        S.cfg[f] = nv; S.added = false; refreshConfig(false); break;
      case 'mode': case 'layers': case 'heading': case 'mount': case 'rail': case 'sheerId': case 'mainId': case 'shape': case 'panels':
        S.cfg[f] = f === 'panels' ? Number(v) : v; S.added = false;
        settle(f);
        refreshConfig(true); if (f === 'sheerId' || f === 'mainId') sayFabric(fabricById(v)); break;
      case 'b-name': S.book.name = v; clearFixed('name'); break;
      case 'b-phone': S.book.phone = v; clearFixed('phone'); break;
      case 'b-email': S.book.email = v; clearFixed('email'); break;
      case 'b-address': S.book.address = v; clearFixed('address'); break;
      case 'b-notes': S.book.notes = v; break;
      case 'b-hp': S.book.hp = v; break;
      case 'b-consent': S.book.consent = el.checked; clearFixed('consent'); break;
      case 'b-callback': S.book.callback = el.checked; delete S.book.errors.slot; setHTML($('book-slots'), slotsHtml()); break;
      case 'b-zone': S.zone = v; saveEst(); delete S.book.errors.slot; setHTML($('book-slots'), slotsHtml()); setHTML($('book-attached'), attachedText()); break;
      case 'bday': S.book.day = v; if (S.book.slot.split('|')[0] !== v) S.book.slot = ''; setHTML($('book-slots'), slotsHtml()); break;
      case 'slot':
        S.book.slot = v; delete S.book.errors.slot; setHTML($('book-slots'), slotsHtml());
        say(t('book.chosen', { date: fmtDate(v.split('|')[0], 'day'), slot: t('slot.' + v.split('|')[1]) })); break;
      case 't-code': S.track.code = v; break;
      case 't-pin': S.track.pin = v; break;
      case 'lead': S.ops.lead[k] = v; break;
      case 'od-draft': S.ops.drafts[k] = v; break;
      case 'od-contact': if (S.ops.contact) S.ops.contact[k] = v; break;
      case 'od-pick': S.ops.drafts[k] = v; if (isChange) refreshOps(el.id); break; // which slots are taken depends on the day and team picked
      case 'od-room': if (o) Ops.setWindowField(st, o, i, 'room', v, !isChange); break;
      case 'od-size':
        if (!o || !Ops.editable(o) || !o.windows[i] || isChange) break; // applied while typing; only the parts that depend on it are redrawn, so a tap already on its way is not lost
        w = o.windows[i];
        var hadManual = w.manual !== null;
        Ops.setWindowField(st, o, i, k, num(v), !!S.ops.sizeLogged[i + k]); S.ops.sizeLogged[i + k] = true;
        S.ops.flash = hadManual ? t('flash.manualCleared') : '';
        if (hadManual) { delete S.ops.drafts['man' + i]; say(S.ops.flash); }
        S.ops.err['man' + i] = false;
        setHTML($('od-manrow-' + i), manRowHtml(w, i)); setHTML($('od-log'), logHtml(o));
        var vb = $('od-v-' + i); if (vb) vb.checked = false;
        var bad = Pricing.computeWindow(w.cfg).errors.some(function (e) { return e.indexOf(k) === 0; });
        if (bad) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid');
        var ve = $('od-ver-err-' + i); if (ve) ve.textContent = ''; S.ops.err['ver' + i] = false;
        var di = $('od-discount'); if (di && S.ops.drafts.discount === undefined) di.value = o.discount || '';
        setHTML($('od-wsum-' + i), wsumHtml(w)); setHTML($('od-next'), nextHtml(o)); setHTML($('od-est'), estNowHtml(o)); setHTML($('od-foot'), footHtml(o));
        break;
      case 'od-cfg':
        if (!o) break;
        r = Ops.setWindowField(st, o, i, k, v);
        S.ops.notes[i] = r.ok ? changeNote(r.changed) : ''; S.ops.err['ver' + i] = false;
        refreshOps(el.id, ''); break;
      case 'od-substrate': if (o) { Ops.setWindowField(st, o, i, 'substrate', v); refreshOps(el.id, ''); } break;
      case 'od-verified':
        if (!o) break;
        r = Ops.setVerified(st, o, i, el.checked);
        S.ops.err['ver' + i] = !r.ok;
        refreshOps(el.id, ''); break;
      case 'od-flag': if (o) { r = Ops.workFlag(st, o, i, k, el.checked); refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-signoff': if (o) { r = Ops.setSignoff(st, o, el.checked); refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-accepted': if (o) { r = Ops.setAccepted(st, o, el.checked); if (r.ok) S.ops.err.deposit = null; refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-longlead': if (o) { r = Ops.setLongLead(st, o, el.checked); if (r.ok) S.ops.err.deposit = null; refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
      case 'od-hold': if (o) { r = Ops.setHold(st, o, v); S.ops.err.deposit = null; refreshOps(el.id, r.ok ? t('flash.saved') : ''); } break;
    }
  }
  document.addEventListener('input', function (ev) { var el = ev.target.closest('[data-f]'); if (el && (el.type === 'text' || el.type === 'tel' || el.type === 'range' || el.tagName === 'TEXTAREA')) onField(el, false); });
  document.addEventListener('change', function (ev) { var el = ev.target.closest('[data-f]'); if (el && el.type !== 'range') onField(el, true); });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'book-form') submitBooking();
    if (ev.target.id === 'track-form') {
      S.track.result = Ops.findForTracking(st, S.track.code, S.track.pin);
      setHTML($('track-out'), trackResult());
      var res = $('track-res');
      if (res) { res.focus({ preventScroll: true }); if (res.scrollIntoView) res.scrollIntoView({ block: 'nearest' }); say(S.track.result.order ? S.track.result.order.code + ': ' + t('c.' + S.track.result.order.status) : t('track.notFound')); }
    }
    if (ev.target.id === 'lead-form') {
      var ld = S.ops.lead, r = Ops.createStaffLead(st, { name: ld.name, phone: ld.phone, address: ld.address, notes: ld.notes, zone: ld.zone, source: ld.source });
      if (!r.ok) { ld.err = true; refreshOps(r.error === 'phone' ? 'lead-phone' : 'lead-name'); say(t('ops.e.lead')); return; }
      S.ops.lead = emptyLead(); S.ops.leadOpen = false;
      openDrawer(r.order.id, 'card-' + r.order.id);
      S.ops.flash = t('flash.lead'); setHTML($('od-foot'), footHtml(r.order)); say(S.ops.flash);
    }
  });
  document.addEventListener('keydown', function (ev) {
    var enter = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-enter');
    if (ev.key === 'Enter' && enter) { // Enter in an amount or invoice field presses the button next to it
      var btn = $(enter); if (btn) { ev.preventDefault(); btn.click(); }
      return;
    }
    if (ev.key === 'Escape' && S.menu) { setMenu(false, true); return; }
    if (!S.ops.open) return;
    if (ev.key === 'Escape') { closeDrawer(); return; }
    if (ev.key === 'Tab') { // keep focus inside the dialog
      var d = $('drawer'); if (!d) return;
      var f = d.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,a[href]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1], a = document.activeElement;
      var afterLast = d.contains(a) && a !== last && !!(last.compareDocumentPosition(a) & 4); // e.g. the status line in the footer
      if (ev.shiftKey && (a === first || !d.contains(a))) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && (a === last || afterLast || !d.contains(a))) { ev.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener('hashchange', function () {
    var v = location.hash.replace('#', '') || 'home';
    if (closing) { // the step back after closing an order has arrived
      closing = false; if (closingTimer) clearTimeout(closingTimer);
      if (S.ops.open && v === 'ops') { setHash('ops-' + S.ops.open); S.ops.pushed = true; } // another order was opened meanwhile
      return;
    }
    if (v.indexOf('ops-') === 0) {
      var id = v.slice(4);
      if (!orderById(id)) return;
      if (S.view !== 'ops') { S.view = 'ops'; render(); }
      if (S.ops.open !== id) openDrawer(id, 'card-' + id, true);
      return;
    }
    if (S.ops.open && v === 'ops') { closeDrawer(true); return; } // Back from an open order
    var ph = parseHash(v);
    if (VIEWS.indexOf(ph.view) >= 0 && hashFor() !== v) go(ph.view, true, ph.param);
  });
  window.addEventListener('resize', function () {
    var top = $('page-top');
    if (top) root.style.setProperty('--top-h', (getComputedStyle(top).position === 'sticky' ? top.offsetHeight : 0) + 'px');
    var mb = $('menu-btn'); if (S.menu && mb && getComputedStyle(mb).display === 'none') setMenu(false); // the wide layout has no menu to keep open
  });

  /* ----- boot ----- */
  loadPrefs();
  var start = '';
  try { start = location.hash.replace('#', ''); } catch (e) { start = ''; }
  var first = parseHash(start);
  S.view = VIEWS.indexOf(first.view) >= 0 ? first.view : start.indexOf('ops-') === 0 && !PUBLIC_ONLY ? 'ops' : 'home';
  if (S.view === 'fabric') { if (FAMILIES.indexOf(first.param) >= 0) S.fab = first.param; else S.view = 'catalog'; }
  if (S.view === 'inspire' && byId(INSPIRE, first.param)) S.insp = first.param;
  if (S.view === 'guides' && byId(GUIDES, first.param)) S.guide = first.param;
  if (S.view === 'ops' && start.indexOf('ops-') === 0 && orderById(start.slice(4))) S.ops.open = start.slice(4);
  if (!start || (start.indexOf('ops-') !== 0 && hashFor() !== start)) { try { history.replaceState(null, '', '#' + hashFor()); } catch (e) { /* the first Back then leaves the page */ } }
  render();
  if (S.ops.open) { var oc = $('od-close'); if (oc) oc.focus(); }
})();
